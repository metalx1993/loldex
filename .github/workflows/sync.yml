name: sync

# Verified D2 upstream snapshot: validate, rebuild, test, commit to main.
#
# Deployment is NOT part of this workflow. Publishing site/ to the live host
# needs an atomic mechanism (versioned staging plus a server-side switch); the
# previous FTP step could leave public_html half-updated on a mid-transfer
# failure, so it has been removed rather than left behind a disabled guard.
# That work is amendment A2 — Atomic Deployment.
#
# Scheduled refresh enabled after A2/D2 and Phase 7–9 production acceptance.

on:
  schedule:
    - cron: "0 4 * * 1"        # every Monday 04:00 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    # Publication is only ever allowed from main, including manual dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Install isolated PHP test interpreter
        run: npm install --prefix work/php-runtime --no-audit --no-fund @php-wasm/node@3.1.61

      # The candidate corpus must be built, validated, tested and published under
      # ONE base commit. Record it before acquisition; re-check it before push.
      - name: Record acquisition base
        id: base
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Acquire five public upstream repositories
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loldex-upstreams"
          git -c credential.helper= clone --depth 1 --no-checkout https://github.com/GTFOBins/GTFOBins.github.io.git "$RUNNER_TEMP/loldex-upstreams/GTFOBins"
          git -c credential.helper= clone --depth 1 --no-checkout https://github.com/LOLBAS-Project/LOLBAS.git "$RUNNER_TEMP/loldex-upstreams/LOLBAS"
          git -c credential.helper= clone --depth 1 --no-checkout https://github.com/magicsword-io/LOLDrivers.git "$RUNNER_TEMP/loldex-upstreams/LOLDrivers"
          git -c credential.helper= clone --depth 1 --no-checkout https://github.com/lolad-project/lolad-project.github.io.git "$RUNNER_TEMP/loldex-upstreams/LOLAD"
          git -c credential.helper= clone --depth 1 --no-checkout https://github.com/WADComs/WADComs.github.io.git "$RUNNER_TEMP/loldex-upstreams/WADComs"

      - name: Prepare complete verified D2 snapshot and all derived views
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          python -m scripts.verified_refresh --repo . --expected-base "$BASE_SHA" \
            --output "$RUNNER_TEMP/loldex-candidate" \
            --source "GTFOBins=$RUNNER_TEMP/loldex-upstreams/GTFOBins" \
            --source "LOLBAS=$RUNNER_TEMP/loldex-upstreams/LOLBAS" \
            --source "LOLDrivers=$RUNNER_TEMP/loldex-upstreams/LOLDrivers" \
            --source "LOLAD=$RUNNER_TEMP/loldex-upstreams/LOLAD" \
            --source "WADComs=$RUNNER_TEMP/loldex-upstreams/WADComs"

      - name: Validate entries
        run: python -m scripts.validate

      - name: Rebuild validated site and knowledge data
        run: python -m scripts.build_all

      - name: Hard test gate
        run: python -m pytest -q

      # Stage only. No commit is created here: if the acquisition base has moved
      # the run must end having created nothing at all.
      - name: Stage candidate
        id: candidate
        run: |
          set -euo pipefail
          git config user.name  "loldex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ site/data.json site/catalog.json site/evidence.json site/evidence-records/ site/graph.json site/techniques.json site/identities.json site/openapi-v1.json site/build-manifest.json site/registry-license.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no corpus change"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish only onto the unchanged acquisition base
        if: steps.candidate.outputs.changed == 'true'
        env:
          SYNC_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          origin_url="$(git remote get-url origin)"
          trap 'git remote set-url origin "$origin_url"' EXIT
          git remote set-url origin \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags origin main
          remote_sha="$(git rev-parse origin/main)"

          # Fail closed, before anything is committed. The candidate was acquired,
          # validated and tested with the code at BASE_SHA; if main has moved, that
          # code is not what would be published. Deliberately no rebase: rebasing
          # would publish data produced by the old code on top of the new code. The
          # next run re-syncs cleanly against the new base.
          if [ "$remote_sha" != "$BASE_SHA" ]; then
            echo "main moved from $BASE_SHA to $remote_sha during this run."
            echo "Discarding the staged candidate; re-run the sync to rebuild on the new base."
            exit 1
          fi

          # The base is confirmed unchanged, so the tested tree is the publishable
          # tree. Only now does a commit exist.
          git commit -m "sync: refresh index from upstream ($(date -u +%F))"

          # Plain push: a race landing after the check above is rejected as a
          # non-fast-forward. No force, no lease, no silent overwrite.
          git push origin HEAD:main
