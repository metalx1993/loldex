name: sync

# Auto-sync from upstream catalogues, validate, rebuild site data, and commit.
# This is what makes the index self-maintaining.

on:
  # CONTAINMENT (2026-08-31): the scheduled trigger is disabled because this job
  # can commit and push to main without running the test suite. Re-enable it only
  # together with the CP5.1 Corrective Amendment A1 test gate. Manual dispatch is
  # deliberately preserved — the sync has only ever run manually.
  # schedule:
  #   - cron: "0 4 * * 1"      # every Monday 04:00 UTC
  workflow_dispatch: {}         # manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Sync adapters
        run: python -m scripts.sync

      - name: Validate entries
        run: python -m scripts.validate

      - name: Rebuild site data
        run: python -m scripts.build_site_data

      - name: Commit changes
        run: |
          git config user.name  "loldex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ site/data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "sync: refresh index from upstream ($(date -u +%F))"
            git push
          fi

      # Deploy the refreshed site to the live host (SiteGround) over FTP.
      # Requires three repo secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
      # If they aren't set, this step is skipped and the site stays as-is.
      - name: Deploy site to SiteGround
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
