name: sync

# Auto-sync from upstream catalogues, validate, rebuild site data, and commit.
# This is what makes the index self-maintaining.

on:
  schedule:
    - cron: "0 4 * * 1"        # every Monday 04:00 UTC
  workflow_dispatch: {}         # manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Sync adapters
        run: python -m scripts.sync

      - name: Validate entries
        run: python -m scripts.validate

      - name: Rebuild site data
        run: python -m scripts.build_site_data

      - name: Commit changes
        run: |
          git config user.name  "loldex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ site/data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "sync: refresh index from upstream ($(date -u +%F))"
            git push
          fi
