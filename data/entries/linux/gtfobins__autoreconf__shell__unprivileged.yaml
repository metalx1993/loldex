id: gtfobins/autoreconf/shell/unprivileged
type: binary
platform: linux
name: autoreconf
phases:
- execution
capabilities:
- shell
privilege_required: user
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: GPL-3.0
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: 'echo ''/bin/sh 1>&0'' >/path/to/temp-file

    chmod +x /path/to/temp-file

    echo AC_INIT >configure.ac

    AUTOM4TE=/path/to/temp-file autoreconf'
  comment: The shell is invoked multiple times.
references:
- https://gtfobins.github.io/gtfobins/autoreconf/
tags:
- linux
- unix
- gtfobins
