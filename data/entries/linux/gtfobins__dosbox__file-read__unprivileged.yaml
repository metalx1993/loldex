commands:
- template: dosbox -c 'mount c /' -c 'type c:\path\to\input'
  comment: The file content will be displayed in the DOSBox graphical window.
- template: 'dosbox -c ''mount c /'' -c ''copy c:\path\to\input c:\path\to\output'' -c exit

    cat /path/to/OUTPUT'
  comment: The file is copied to a readable location.
