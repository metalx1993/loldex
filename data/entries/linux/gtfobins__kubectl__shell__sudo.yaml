commands:
- template: "cat >/path/to/temp-file <<EOF\nclusters:\n- cluster:\n    server: https://x\n  name: x\n\
    contexts:\n- context:\n    cluster: x\n    user: x\n  name: x\ncurrent-context: x\nusers:\n- name:\
    \ x\n  user:\n    exec:\n      apiVersion: client.authentication.k8s.io/v1\n      interactiveMode:\
    \ Always\n      command: /bin/sh\n      args:\n        - '-c'\n        - '/bin/sh 0<&2 1>&2'\nEOF\n\
    \nkubectl get pods --kubeconfig=/path/to/temp-file"
