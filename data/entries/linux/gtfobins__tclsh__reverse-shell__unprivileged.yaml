id: gtfobins/tclsh/reverse-shell/unprivileged
type: binary
platform: linux
name: tclsh
phases:
- execution
- command-and-control
capabilities:
- reverse-shell
privilege_required: user
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: GPL-3.0
