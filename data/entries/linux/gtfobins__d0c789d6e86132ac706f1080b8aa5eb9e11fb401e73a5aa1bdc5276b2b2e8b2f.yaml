      documents:
        virsh:
          functions:
            command:
            - code: "cat >/path/to/temp-file.xml <<EOF\n<domain type='kvm'>\n  <name>x</name>\n  <os>\n\
                \    <type arch='x86_64'>hvm</type>\n  </os>\n  <memory unit='KiB'>1</memory>\n  <devices>\n\
                \    <interface type='ethernet'>\n      <script path='/path/to/command'/>\n    </interface>\n\
                \  </devices>\n</domain>\nEOF\nvirsh -c qemu:///system create /path/to/temp-file.xml\n\
                virsh -c qemu:///system destroy x"
              contexts:
                sudo: null
            file-write:
            - code: "echo DATA >/path/to/temp-file\n\ncat >/path/to/temp-file.xml <<EOF\n<volume type='file'>\n\
                \  <name>y</name>\n  <key>/path/to/output-dir/output-file</key>\n  <source>\n  </source>\n\
                \  <capacity unit='bytes'>5</capacity>\n  <allocation unit='bytes'>4096</allocation>\n\
                \  <physical unit='bytes'>5</physical>\n  <target>\n    <path>/path/to/output-dir/output-file</path>\n\
                \    <format type='raw'/>\n    <permissions>\n      <mode>0600</mode>\n      <owner>0</owner>\n\
                \      <group>0</group>\n    </permissions>\n  </target>\n</volume>\nEOF\n\nvirsh -c qemu:///system\
                \ pool-create-as x dir --target /path/to/output-dir/\nvirsh -c qemu:///system vol-create\
                \ --pool x --file /path/to/temp-file.xml\nvirsh -c qemu:///system vol-upload --pool x\
                \ /path/to/output-dir/output-file /path/to/temp-file\nvirsh -c qemu:///system pool-destroy\
                \ x"
              comment: This requires the user to be in the `libvirt` group. If the target directory doesn't
                exist, `pool-create-as` must be run with the `--build` option. The destination file ownership
                and permissions can be set in the XML.
              contexts:
                sudo: null
                unprivileged: null
            - code: 'virsh -c qemu:///system pool-create-as x dir --target /path/to/dir/

                virsh -c qemu:///system vol-download --pool x input-file output-file

                virsh -c qemu:///system pool-destroy x'
              comment: This requires the user to be in the `libvirt` group.
              contexts:
