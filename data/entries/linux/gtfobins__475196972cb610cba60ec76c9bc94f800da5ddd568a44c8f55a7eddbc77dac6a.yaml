            - code: tar cf /dev/stdout /path/to/input-file -I 'tar xO'
              comment: The file is read then passed to the specified command (e.g., `tar xO`) via standard
                input.
              contexts:
                sudo: null
                suid: null
                unprivileged: null
              version: GNU
