  last_synced: '2026-08-25'
commands:
- template: 'split -b 999 --additional-suffix suffix /path/to/input-file prefix

    cat prefixaasuffix'
  comment: This copies the input file in the current working directory in a file named `prefixaasuffix`,
    just make sure to pick a value big enough, instead of `999`.
references:
