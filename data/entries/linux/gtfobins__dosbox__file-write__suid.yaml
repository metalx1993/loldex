commands:
- template: dosbox -c 'mount c /' -c "echo DATA >c:\path\to\output" -c exit
  comment: Note that `echo` terminates the string with a DOS-style line terminator (`\r\n`), if that's
    a problem and your scenario allows it, you can create the file outside `dosbox`, then use `copy` to
    do the actual write.
