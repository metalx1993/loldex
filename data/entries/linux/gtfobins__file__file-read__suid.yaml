id: gtfobins/file/file-read/suid
type: binary
platform: linux
name: file
phases:
- collection
- privilege-escalation
capabilities:
- file-read
privilege_required: suid
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: file -f /path/to/input-file
  comment: Each input line is treated as a filename for the `file` command and the output is corrupted
    by a suffix `:` followed by the result or the error of the operation.
- template: file -m /path/to/input-file
  comment: 'Each line is corrupted by a prefix string and wrapped inside quotes.


    If a line in the target file begins with a `#`, it will not be printed as these lines are parsed as
    comments.


    It can also be provided with a directory and will read each file in the directory.'
