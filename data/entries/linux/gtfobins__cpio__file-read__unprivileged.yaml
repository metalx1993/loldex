id: gtfobins/cpio/file-read/unprivileged
type: binary
platform: linux
name: cpio
phases:
- collection
capabilities:
- file-read
privilege_required: user
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: echo /path/to/input-file | cpio -o
  comment: The content of the file is printed to standard output, between the `cpio` archive format header
    and footer.
- template: 'echo /path/to/input-file | cpio -dp .

    cat path/to/input-file'
  comment: The whole directory structure is copied to `.`, hence this is also a file write.
references:
- https://gtfobins.github.io/gtfobins/cpio/
tags:
- linux
- unix
- gtfobins
