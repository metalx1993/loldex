privilege_required: user
sources:
- project: GTFOBins
  upstream_url: https://gtfobins.github.io
  license: MIT (verify upstream LICENSE)
  upstream_version: acd5246
  last_synced: '2026-08-25'
commands:
- template: 'wireshark -c 1 -i lo -k -f ''udp port 12345'' &

    echo DATA | nc -u 127.127.127.127 12345'
  comment: 'This technique can be used to write arbitrary files, i.e., the dump of one UDP packet.


    After starting Wireshark, and waiting for the capture to begin, deliver the UDP packet, e.g., with
    `nc` (see below). The capture then stops and the packet dump can be saved:


    1. select the only received packet;


    2. right-click on "Data" from the "Packet Details" pane, and select "Export Packet Bytes...";


    3. choose where to save the packet dump.'
references:
- https://gtfobins.github.io/gtfobins/wireshark/
