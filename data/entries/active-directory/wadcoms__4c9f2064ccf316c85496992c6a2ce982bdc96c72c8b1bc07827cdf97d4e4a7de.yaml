  comment: "BloodHound is a single page Javascript web application, built on top of Linkurious, compiled\
    \ with Electron, with a Neo4j database fed by a data collector. BloodHound uses graph theory to reveal\
    \ the hidden and often unintended relationships within an Active Directory environment. Attackers\
    \ can use BloodHound to easily identify highly complex attack paths that would otherwise be impossible\
    \ to quickly identify. Defenders can use BloodHound to identify and eliminate those same attack paths.\
    \ Both blue and red teams can use BloodHound to easily gain a deeper understanding of privilege relationships\
    \ in an Active Directory environment.\n\nBloodHound.py is a Python based ingestor for BloodHound,\
    \ based on Impacket. It allows you to remotely collect data for bloodhound by querying LDAP\n\nCommand\
    \ Reference:\n\n\tTarget IP: 10.10.10.1\n\n\tDomain: test.local\n"
