id: wadcoms/pwshadmodule-initial-enum
type: technique
platform: active-directory
name: PwshADmodule Initial Enum
phases:
- discovery
capabilities:
- discovery
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
  license: GPL-3.0
  upstream_version: a864cd1
  last_synced: '2026-08-25'
commands:
- template: '#Getting all DCs in the forest

    (Get-ADForest).Domains | % { Get-ADDomainController -DomainName $_ -Discover }


    #Getting all users in the forest

    (Get-ADForest).Domains | % { Get-ADUser -Filter * -Server $_ }


    #Getting all computers in the forest

    (Get-ADForest).Domains | % { Get-ADComputer -Filter * -Server $_ }


    #Mapping out entire trust relationships

    Get-ADTrust -Filter ''(intraForest -ne $True) -and (ForestTransitive -ne $True)'' | Select-Object
    Source,Target,Name


    #Getting all groups in a domain. Note that the select statement will limit the output to only the
    matching fields the object contains

    Get-ADGroup -Filter * | Select-Object SamAccountName, GroupScope, DistinguishedName'
  comment: These commands provide a quick refernece for using the AD module to get situational awerness
    of the AD environment. Note that to get more commands that you can run, use the get command cmdlet,
    e.g. `Get-Command -Module ActiveDirectory` But Thes are the standard commands that will
references:
- https://docs.microsoft.com/en-us/powershell/module/activedirectory/
- https://github.com/samratashok/ADModule
