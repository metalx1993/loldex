  comment: "Rubeus' `s4u` module performs Kerberos constrained delegation attacks using the S4U2Self and\
    \ S4U2Proxy. This technique abuses accounts configured with delegation privileges (msDS-AllowedToDelegateTo)\
    \ to impersonate any domain user and further alter the service specified since SPNs are stored in\
    \ plaintext and thus access any service on the target system as any user\n\nCommand Reference:\n\n\
    \tDomain: test.local\n\n  SPN: time/dc.test.local\n\n  alternative service: ldap(can chose any valid\
    \ services such as HTTP for remoting access)\n\n\tUsername: john$\n\n\tHash: 2a3de7fe356ee524cc9f3d579f2e0aa7\n"
