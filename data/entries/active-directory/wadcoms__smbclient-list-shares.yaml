id: wadcoms/smbclient-list-shares
type: technique
platform: active-directory
name: SMBClient List Shares
phases:
- discovery
capabilities:
- discovery
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
  license: GPL-3.0
  upstream_version: a864cd1
  last_synced: '2026-08-28'
preconditions:
- a valid username
- a valid password
commands:
- template: smbclient -L \\test.local -I 10.10.10.1 -U john password123
  comment: 'Smbclient is a tool used to communicate with SMB servers. The following command will list
    out all available shares on the target server using valid credentials. Command Reference: Target IP:
    10.10.10.1 Domain: test.local Username: john Password: password123'
references:
- https://www.samba.org/samba/docs/current/man-html/smbclient.1.html
tags:
- active-directory
- wadcoms
- smb
