  WADComs:
    raw:
      file: PwshADmodule-DelegationAttack-Enum.md
      document: "---\ndescription: |\n  Having imported the pwsh AD module referenced in the project,\
        \ we can begin to use it to enumerate for potential points of exploit\n  one of the prime being\
        \ kerberos delegation attacks. The following 4 line commands will enumerate the entire AD forest\
        \ for RBCD, Constrained and Unconstrained delegation attacks.\n  Note that we will also factor\
        \ in protocol trainsiton as those change the attack vector slightly. See references below\n\n\
        command: |\n  # 1. Unconstrained (turned on for all Domain controllers by default)\n  (Get-ADForest).Domains\
        \ | % { Get-ADComputer -Filter {TrustedForDelegation -eq $true} -Server $_ | select Name,DNSHostName;\
        \ Get-ADUser -Filter {TrustedForDelegation -eq $true} -Server $_ | select Name,SamAccountName\
        \ }\n\n\n  # 2. Constrained (with protocol transition check)\n  (Get-ADForest).Domains | % { Get-ADComputer\
        \ -Filter {msDS-AllowedToDelegateTo -like \"*\"} -Properties msDS-AllowedToDelegateTo,TrustedToAuthForDelegation\
        \ -Server $_ | select Name,TrustedToAuthForDelegation,msDS-AllowedToDelegateTo; Get-ADUser -Filter\
        \ {msDS-AllowedToDelegateTo -like \"*\"} -Properties msDS-AllowedToDelegateTo,TrustedToAuthForDelegation\
        \ -Server $_ | select Name,TrustedToAuthForDelegation,msDS-AllowedToDelegateTo }\n  \n  # 3. RBCD\
        \ (which object is already configured)\n  (Get-ADForest).Domains | % { Get-ADComputer -Filter\
        \ * -Properties msDS-AllowedToActOnBehalfOfOtherIdentity -Server $_ | ? {$_.\"msDS-AllowedToActOnBehalfOfOtherIdentity\"\
        } | select Name,DNSHostName }\n\n  # 4. RBCD (which object can configure it - write access)\n\
        \  (Get-ADForest).Domains | % { Get-ADComputer -Filter * -Properties nTSecurityDescriptor -Server\
        \ $_ | ? {$_.nTSecurityDescriptor.Access | ? {$_.ActiveDirectoryRights -match \"GenericWrite|WriteProperty\"\
        \ -and $_.IdentityReference -notmatch \"SYSTEM|Domain Admins\"}} | select Name }\n\nitems:\n \
        \ - PowerShell\nOS:\n  - Windows\nattack_types:\n  - Enumeration\nreferences:\n  - https://redfoxsec.com/blog/attacking-kerberos-delegation/\n\
        \  - https://shenaniganslabs.io/2019/01/28/Wagging-the-Dog.html\n  - https://dirkjanm.io/krbrelayx-unconstrained-delegation-abuse-toolkit/\n\
        \  - https://github.com/samratashok/ADModule\n\n---"
