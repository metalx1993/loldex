      document: "---\ndescription: |\n  SafetyKatz.exe is part of the GhostPack suite of tools and is\
        \ a combination of SharpDump and Mimikatz. The following command will dump the LSASS process and\
        \ run Mimikatz to extract credentials from the dumped process. Safetykatz also supports a number\
        \ of mimikatz native commands such as \"sekurlsa::evasive-keys\" etc. The evasive switch in lab\
        \ and production enviroments up to windows 2016 has been noted to successfully run where the non\
        \ \"evasive\" switches had not\n\ncommand: |\n  safetykatz.exe \"privilege::debug\" \"sekurlsa::evasive-logonpasswords\"\
        \ \"exit\"\nitems:\n  - Shell\nOS:\n  - Windows\nattack_types:\n  - PrivEsc\n  - Enumeration\n\
        references:\n  - https://github.com/GhostPack/SafetyKatz\n  - https://www.harmj0y.net/blog/redteaming/ghostpack/\n\
        ---\n"
