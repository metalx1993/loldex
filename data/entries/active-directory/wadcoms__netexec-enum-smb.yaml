id: wadcoms/netexec-enum-smb
type: technique
platform: active-directory
name: NetExec Enum SMB
phases:
- discovery
capabilities:
- discovery
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
  license: GPL-3.0
  upstream_version: a864cd1
  last_synced: '2026-08-25'
preconditions:
- a valid username
- a valid password
commands:
- template: nxc smb 10.10.10.1 -u 'john' -p 'password123' --groups --local-groups --loggedon-users --rid-brute
    --sessions --users --shares --pass-pol
