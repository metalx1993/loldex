  comment: "Impacket rbcd.py will modify the msDS-AllowedToActOnBehalfOfOtherIdentity property of a target\
    \ computer with security descriptor of another computer.\nThe following command adds the related security\
    \ descriptor of the created EVILCOMPUTER to the msDS-AllowedToActOnBehalfOfOtherIdentity property\
    \ of DC01.\nThis basically means that EVILCOMPUTER can get impersonated service tickets for DC01 using\
    \ getST.py.\n\nCommand Reference:\n\n  Target IP: 10.10.10.1\n\n  Domain: test.local\n\n  Username:\
    \ john\n\n  Hash: :A9FDFA038C4B75EBC76DC855DD74F0DA\n\n  Delegate To: DC01$\n\n  Delegate From: EVILCOMPUTER$\n"
