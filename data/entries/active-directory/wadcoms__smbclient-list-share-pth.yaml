id: wadcoms/smbclient-list-share-pth
type: technique
platform: active-directory
name: SMBClient List Share PTH
phases:
- discovery
capabilities:
- discovery
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
  license: GPL-3.0
  upstream_version: a864cd1
  last_synced: '2026-08-28'
preconditions:
- a valid username
- an NTLM hash (pass-the-hash)
commands:
- template: smbclient -L \\10.10.10.1 -U test.local/john --pw-nt-hash XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
  comment: 'Smbclient is a tool used to communicate with SMB servers. The following command will list
    out all available shares on the target ip using user John hash on test domain. Command Reference:
    Target IP: 10.10.10.1 Domain: test.local Username: john Hash: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
references:
- https://www.samba.org/samba/docs/current/man-html/smbclient.1.html
tags:
- active-directory
- wadcoms
- smb
