  comment: "targetedKerberoast is a Python script that can, like many others (e.g. GetUserSPNs.py), print\
    \ \"kerberoast\" hashes for user accounts that have a SPN set. This tool brings the following additional\
    \ feature: for each user without SPNs, it tries to set one (abuse of a write permission on the servicePrincipalName\
    \ attribute), print the \"kerberoast\" hash, and delete the temporary SPN set for that operation.\n\
    \nCommand Reference:\n\n\tTarget IP: 10.10.10.1\n\n\tAttacker IP: 10.10.10.2\n\n\tDomain: test.local\n\
    \n\tUsername: john\n\n\tPassword: password123\n"
