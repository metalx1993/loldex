id: wadcoms/pwshadmodule-delegationattack-enum
type: technique
platform: active-directory
name: PwshADmodule DelegationAttack Enum
phases:
- discovery
capabilities:
- discovery
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
  license: GPL-3.0
  upstream_version: a864cd1
  last_synced: '2026-08-28'
preconditions:
- powershell
commands:
- template: '# 1. Unconstrained (turned on for all Domain controllers by default)

    (Get-ADForest).Domains | % { Get-ADComputer -Filter {TrustedForDelegation -eq $true} -Server $_ |
    select Name,DNSHostName; Get-ADUser -Filter {TrustedForDelegation -eq $true} -Server $_ | select Name,SamAccountName
    }



    # 2. Constrained (with protocol transition check)

    (Get-ADForest).Domains | % { Get-ADComputer -Filter {msDS-AllowedToDelegateTo -like "*"} -Properties
    msDS-AllowedToDelegateTo,TrustedToAuthForDelegation -Server $_ | select Name,TrustedToAuthForDelegation,msDS-AllowedToDelegateTo;
    Get-ADUser -Filter {msDS-AllowedToDelegateTo -like "*"} -Properties msDS-AllowedToDelegateTo,TrustedToAuthForDelegation
    -Server $_ | select Name,TrustedToAuthForDelegation,msDS-AllowedToDelegateTo }


    # 3. RBCD (which object is already configured)

    (Get-ADForest).Domains | % { Get-ADComputer -Filter * -Properties msDS-AllowedToActOnBehalfOfOtherIdentity
    -Server $_ | ? {$_."msDS-AllowedToActOnBehalfOfOtherIdentity"} | select Name,DNSHostName }


    # 4. RBCD (which object can configure it - write access)

    (Get-ADForest).Domains | % { Get-ADComputer -Filter * -Properties nTSecurityDescriptor -Server $_
    | ? {$_.nTSecurityDescriptor.Access | ? {$_.ActiveDirectoryRights -match "GenericWrite|WriteProperty"
    -and $_.IdentityReference -notmatch "SYSTEM|Domain Admins"}} | select Name }'
  comment: Having imported the pwsh AD module referenced in the project, we can begin to use it to enumerate
    for potential points of exploit one of the prime being kerberos delegation attacks. The following
    4 line commands will enumerate the entire AD forest for RBCD, Constrained and Uncons
references:
- https://redfoxsec.com/blog/attacking-kerberos-delegation/
- https://shenaniganslabs.io/2019/01/28/Wagging-the-Dog.html
- https://dirkjanm.io/krbrelayx-unconstrained-delegation-abuse-toolkit/
- https://github.com/samratashok/ADModule
tags:
