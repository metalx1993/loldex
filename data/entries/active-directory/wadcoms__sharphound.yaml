id: wadcoms/sharphound
type: technique
platform: active-directory
name: SharpHound
phases:
- privilege-escalation
- discovery
capabilities:
- privilege-escalation
- discovery
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
  license: GPL-3.0
  upstream_version: a864cd1
  last_synced: '2026-08-28'
preconditions:
- shell
commands:
- template: "SharpHound.exe --CollectionMethods All --ZipFileName output.zip\n#Using PowerShell module\n\
    powershell -ep bypass \n.\\SharpHound.ps1\nInvoke-BloodHound -CollectionMethod All -Domain domain.tld\
    \ -ZipFileName output.zip"
  comment: SharpHound.exe and SharpHound.ps1 are the official data collector for BloodHound, written in
    C# or Powershell and uses Windows API functions and LDAP namespace functions to collect data from
    domain controllers and domain-joined Windows systems. This data can then be fed into Bloo
references:
- https://github.com/BloodHoundAD/SharpHound3
- https://bloodhound.specterops.io/collect-data/ce-collection/sharphound
- https://github.com/ZishanAdThandar/pentest/blob/main/notes/ActiveDirectory.md#bloodhound
tags:
- active-directory
- wadcoms
