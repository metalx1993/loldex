id: wadcoms/netexec-ldap-asreproasting
type: technique
platform: active-directory
name: NetExec LDAP ASREPRoasting
phases:
- credential-access
capabilities:
- credential-access
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
