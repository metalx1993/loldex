    reg.exe add "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run" /v Persistence /t REG_SZ
    /d "C:\Path\To\revshell.exe"'
  comment: "It is possible to gain persistence on a windows machine by adding reg keys that will execute\
    \ an arbitrary payload during logon or startup. Keys added to the HKLM hive will execute on startup.\
    \ Keys added to the HKCU hive will execute when the corresponding user logs on. Adding keys into the\
    \ HKLM hive will require an elevated shell. There are four keys that can be used: Run, RunOnce, RunServices,\
    \ and RunServicesOnce. By default, a RunOnce key is deleted after the specified command is executed.\
    \ The path for these keys is the same for the HKLM and HKCU hives.\n\nCommand Reference:\n\n\tValue\
    \ Name: Persistence\n\n\tRegKey data type: REG_SZ\n\n\tData: \"C:\\Path\\To\\revshell.exe\"\n\n\t\
    KeyName: \"HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\"\n"
references:
