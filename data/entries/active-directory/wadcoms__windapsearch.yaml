id: wadcoms/windapsearch
type: technique
platform: active-directory
name: Windapsearch
phases:
- discovery
capabilities:
- discovery
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
  license: GPL-3.0
  upstream_version: a864cd1
  last_synced: '2026-08-28'
preconditions:
- a valid username
- a valid password
commands:
- template: python3 windapsearch --dc-ip 10.10.10.1 -u test.local\\john -p password123 -U -G --da -m "Remote
    Desktop Users" -C -r
  comment: 'windapsearch enumerates users, groups, and computers from a Windows domain through LDAP queries.
    The following command enumerates all 3 of the above mentioned using provided credentials. Command
    Reference: Target IP: 10.10.10.1 Domain: test.local Username: john Password: password'
references:
- https://github.com/ropnop/windapsearch
- https://www.attackdebris.com/?p=470
tags:
- active-directory
- wadcoms
