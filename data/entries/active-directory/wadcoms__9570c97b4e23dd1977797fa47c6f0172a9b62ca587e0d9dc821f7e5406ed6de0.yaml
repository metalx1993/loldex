    raw:
      file: SharpHound.md
      document: "---\ndescription: |\n  SharpHound.exe and SharpHound.ps1 are the official data collector\
        \ for BloodHound, written in C# or Powershell and uses Windows API functions and LDAP namespace\
        \ functions to collect data from domain controllers and domain-joined Windows systems. This data\
        \ can then be fed into BloodHound to enumerate potential paths of privilege escalation. The following\
        \ command peforms all collection methods and stores the output in a zip file that can be directly\
        \ placed in the BloodHound GUI.\n\n  Command Reference:\n\n  \tOutput File: output.zip\n\ncommand:\
        \ |\n  SharpHound.exe --CollectionMethods All --ZipFileName output.zip\n  #Using PowerShell module\n\
        \  powershell -ep bypass \n  .\\SharpHound.ps1\n  Invoke-BloodHound -CollectionMethod All -Domain\
        \ domain.tld -ZipFileName output.zip\nitems:\n  - Shell\nOS:\n  - Windows\nattack_types:\n  -\
        \ PrivEsc\n  - Enumeration\nreferences:\n  - https://github.com/BloodHoundAD/SharpHound3\n  -\
        \ https://bloodhound.specterops.io/collect-data/ce-collection/sharphound\n  - https://github.com/ZishanAdThandar/pentest/blob/main/notes/ActiveDirectory.md#bloodhound\n\
        ---\n"
