    raw:
      file: PwshADmodule-Initial-Enum.md
      document: "---\ndescription: |\n  These commands provide a quick refernece for using the AD module\
        \ to get situational awerness of the AD environment.\n  Note that to get more commands that you\
        \ can run, use the get command cmdlet, e.g. `Get-Command -Module ActiveDirectory` But Thes\n \
        \ are the standard commands that will get you standard. Feel free to replace the first pipe with\
        \ the -server \"your domain\" if you dont want\n  to enumarate the entire forest. For more info\
        \ on using the AD module, please check out our discussion on the AD module in WADCOMs.\n\ncommand:\
        \ |\n  #Getting all DCs in the forest\n  (Get-ADForest).Domains | % { Get-ADDomainController -DomainName\
        \ $_ -Discover }\n\n  #Getting all users in the forest\n  (Get-ADForest).Domains | % { Get-ADUser\
        \ -Filter * -Server $_ }\n\n  #Getting all computers in the forest\n  (Get-ADForest).Domains |\
        \ % { Get-ADComputer -Filter * -Server $_ }\n\n  #Mapping out entire trust relationships\n  Get-ADTrust\
        \ -Filter '(intraForest -ne $True) -and (ForestTransitive -ne $True)' | Select-Object Source,Target,Name\n\
        \n  #Getting all groups in a domain. Note that the select statement will limit the output to only\
        \ the matching fields the object contains\n  Get-ADGroup -Filter * | Select-Object SamAccountName,\
        \ GroupScope, DistinguishedName\n\nOS:\n  - Windows\nattack_types:\n  - Enumeration\nreferences:\n\
        \  - https://docs.microsoft.com/en-us/powershell/module/activedirectory/\n  - https://github.com/samratashok/ADModule\n\
        ---"
