commands:
- template: nxc ldap 10.10.10.1 -u users.txt -p '' --asreproast output.txt
  comment: "NetExec (formerly CrackMapExec) performs an AS-REP Roasting attack via the LDAP service.\n\
    This command attempts to enumerate domain accounts that do not require pre-authentication \nand requests\
    \ Kerberos AS-REP responses for them. The extracted encrypted ticket-granting \nticket (TGT) hashes\
    \ are saved into the specified file and can later be cracked offline \nto recover plaintext credentials.\n\
    \nCommand Reference:\n\n\tTarget IP: 10.10.10.1\n\tDomain: test.local\n\tUsername List: users.txt\n\
    \tPassword: (empty string)\n\tOutput File: output.txt\n"
references:
- https://github.com/Pennyw0rth/NetExec
- https://attack.mitre.org/techniques/T1558/004/
