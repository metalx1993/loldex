id: wadcoms/netexec-enum-ldap
type: technique
platform: active-directory
name: NetExec Enum LDAP
phases:
- discovery
capabilities:
- discovery
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
  license: GPL-3.0
  upstream_version: a864cd1
  last_synced: '2026-08-28'
preconditions:
- a valid username
- a valid password
commands:
- template: nxc ldap 10.10.10.1 -u 'john' -p 'password123' --trusted-for-delegation  --password-not-required
    --admin-count --users --groups
  comment: '"NetExec (a.k.a nxc) is a network service exploitation tool that helps automate assessing
    the security of large networks." - https://www.netexec.wiki/. This command will enumerate domain groups,
    local groups, users, user descriptions, users trusted for delegation, users without a'
references:
- https://github.com/Pennyw0rth/NetExec
- https://www.netexec.wiki/
tags:
- active-directory
- wadcoms
- ldap
