    /d "C:\Path\To\revshell.exe"'
  comment: It is possible to gain persistence on a windows machine by adding reg keys that will execute
    an arbitrary payload during logon or startup. Keys added to the HKLM hive will execute on startup.
    Keys added to the HKCU hive will execute when the corresponding user logs on. Adding key
