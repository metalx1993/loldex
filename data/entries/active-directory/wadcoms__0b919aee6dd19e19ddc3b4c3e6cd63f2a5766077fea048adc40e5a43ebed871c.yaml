commands:
- template: rpcclient -U '' -N 10.10.10.1
  comment: "rpcclient is a tool used for executing client side MS-RPC functions to manage Windows NT clients\
    \ from Unix workstatios. From an offensive security standpoint, it can be used to enumerate users,\
    \ groups, and other potentially sensitive information. The following command attempt to connect to\
    \ the NetBIOS server anonymously, in order to enumerate using MS-RPC available commands/functions.\n\
    \nCommand Reference:\n\n\tTarget IP: 10.10.10.1\n"
