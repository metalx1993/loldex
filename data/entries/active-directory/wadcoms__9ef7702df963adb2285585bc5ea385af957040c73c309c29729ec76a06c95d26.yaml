commands:
- template: python3 ntlmrelayx.py -smb2support -t smb://10.10.10.1 -socks
  comment: "Impacket's ntlmrelayx.py performs NTLM Relay Attacks, creating an SMB and HTTP server and\
    \ relaying credentials to various different protocols (SMB, HTTP, LDAP, etc.).\n\nThe below command\
    \ creates an SMB relay server that targets the IP 10.10.10.1, meaning any credentials that the SMB\
    \ server recieves, gets relayed to that IP to attempt to authenticate and create a socks connection\
    \ to the host. In order for the SMB server to recieve credentials to relay, dementor.py or Petitpotam\
    \ can be used to trigger a forced authentication from the IP it's targeting to an attacker controlled\
    \ SMB server.\n\nCommand Reference:\n\n\tTarget IP: 10.10.10.1\n"
references:
- https://github.com/SecureAuthCorp/impacket/blob/master/examples/ntlmrelayx.py
- https://www.praetorian.com/blog/active-directory-computer-account-smb-relaying-attack
