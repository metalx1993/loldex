  comment: "Impacket's secretsdump.py will perform various techniques to dump secrets from the remote\
    \ machine without executing any agent. Techniques include reading SAM and LSA secrets from registries,\
    \ dumping NTLM hashes, plaintext credentials, and kerberos keys, and dumping NTDS.dit. The following\
    \ command will attempt to use the specified machines NTDS.dit and system file to extract the user\
    \ account hashes associated with that machine.\n\nCommand Reference:\n\n\tTarget IP: 10.10.10.2\n\n\
    \tDomain Controller: 10.10.10.1\n\n\tDomain: test.local\n\n\tUsername: john\n\n\tPassword: password123\n"
