id: wadcoms/PSADmodule-Kerbaroasting
type: technique
platform: active-directory
name: PSADmodule Kerbaroasting
phases:
- execution
capabilities:
- command-execution
privilege_required: domain-user
sources:
- project: WADComs
  upstream_url: https://wadcoms.github.io
