      document: "---\ndescription: |\n  SharpHound.exe is the official data collector for BloodHound,\
        \ written in C# and uses Windows API functions and LDAP namespace functions to collect data from\
        \ domain controllers and domain-joined Windows systems. This data can then be fed into BloodHound\
        \ to enumerate potential paths of privilege escalation. The following command peforms all collection\
        \ methods and will use the provided LDAP credentials when performing LDAP collection methods,\
        \ and stores the output in a zip file that can be directly placed in the BloodHound GUI.\n\n \
        \ Command Reference:\n\n  \tLDAP Username: john\n\n  \tLDAP Password: password123\n\n  \tOutput\
        \ File: output.zip\n\ncommand: |\n  SharpHound.exe --CollectionMethods All --LdapUsername john\
        \ --LdapPassword password123 --ZipFileName output.zip\nitems:\n  - Shell\n  - Username\n  - Password\n\
        services:\n  - LDAP\nOS:\n  - Windows\nattack_types:\n  - PrivEsc\n  - Enumeration\nreferences:\n\
        \  - https://github.com/BloodHoundAD/SharpHound3\n  - https://bloodhound.readthedocs.io/en/latest/data-collection/sharphound.html\n\
        ---\n"
