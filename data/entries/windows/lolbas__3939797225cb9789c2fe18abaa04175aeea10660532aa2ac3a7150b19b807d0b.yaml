      document_utf8: "---\nName: Wsreset.exe\nDescription: Used to reset Windows Store settings according\
        \ to its manifest file\nAuthor: Oddvar Moe\nCreated: 2019-03-18\nCommands:\n  - Command: wsreset.exe\n\
        \    Description: During startup, wsreset.exe checks the registry value HKCU\\Software\\Classes\\\
        AppX82a6gwre4fdg3bt635tn5ctqjf8msdd2\\Shell\\open\\command for the command to run. Binary will\
        \ be executed as a high-integrity process without a UAC prompt being displayed to the user.\n\
        \    Usecase: Execute a binary or script as a high-integrity process without a UAC prompt.\n \
        \   Category: UAC Bypass\n    Privileges: User\n    MitreID: T1548.002\n    OperatingSystem: Windows\
        \ 10, Windows 11\nFull_Path:\n  - Path: C:\\Windows\\System32\\wsreset.exe\nDetection:\n  - Sigma:\
