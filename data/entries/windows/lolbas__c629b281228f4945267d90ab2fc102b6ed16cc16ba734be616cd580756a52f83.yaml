        \ the specified .REG file within an Alternate data stream.\n    Usecase: Hide/plant registry information\
        \ in Alternate data stream for later use\n    Category: ADS\n    Privileges: User\n    MitreID:\
        \ T1564.004\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10,\
        \ Windows 11\n  - Command: reg save HKLM\\SECURITY {PATH_ABSOLUTE:.1.bak} && reg save HKLM\\SYSTEM\
        \ {PATH_ABSOLUTE:.2.bak} && reg save HKLM\\SAM {PATH_ABSOLUTE:.3.bak}\n    Description: Dump registry\
        \ hives (SAM, SYSTEM, SECURITY) to retrieve password hashes and key material\n    Usecase: Dump\
        \ credentials from the Security Account Manager (SAM)\n    Category: Credentials\n    Privileges:\
