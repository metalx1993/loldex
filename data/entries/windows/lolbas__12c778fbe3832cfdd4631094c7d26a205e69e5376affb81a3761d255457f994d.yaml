      document_utf8: "---\nName: Mmc.exe\nDescription: Load snap-ins to locally and remotely manage Windows\
        \ systems\nAuthor: '@bohops'\nCreated: 2018-12-04\nCommands:\n  - Command: mmc.exe -Embedding\
        \ {PATH_ABSOLUTE:.msc}\n    Description: Launch a 'backgrounded' MMC process and invoke a COM\
        \ payload\n    Usecase: Configure a snap-in to load a COM custom class (CLSID) that has been added\
        \ to the registry\n    Category: Execute\n    Privileges: User\n    MitreID: T1218.014\n    OperatingSystem:\
        \ Windows 10 (and possibly earlier versions), Windows 11\n    Tags:\n      - Execute: COM\n  -\
        \ Command: mmc.exe gpedit.msc\n    Description: Load an arbitrary payload DLL by configuring COR\
        \ Profiler registry settings and launching MMC to bypass UAC.\n    Usecase: Modify HKCU\\Environment\
        \ key in Registry with COR profiler values then launch MMC to load the payload DLL.\n    Category:\
        \ UAC Bypass\n    Privileges: Administrator\n    MitreID: T1218.014\n    OperatingSystem: Windows\
        \ 10 (and possibly earlier versions), Windows 11\n    Tags:\n      - Execute: DLL\n  - Command:\
        \ mmc.exe -Embedding {PATH_ABSOLUTE:.msc}\n    Description: Download and save an executable to\
        \ disk\n    Usecase: Download file from Internet\n    Category: Download\n    Privileges: User\n\
        \    MitreID: T1218.014\n    OperatingSystem: Windows 10 (and possibly earlier versions), Windows\
        \ 11\n    Tags:\n      - Application: GUI\nFull_Path:\n  - Path: C:\\Windows\\System32\\mmc.exe\n\
        \  - Path: C:\\Windows\\SysWOW64\\mmc.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/c04bef2fbbe8beff6c7620d5d7ea6872dbe7acba/rules/windows/process_creation/proc_creation_win_mmc_susp_child_process.yml\n\
