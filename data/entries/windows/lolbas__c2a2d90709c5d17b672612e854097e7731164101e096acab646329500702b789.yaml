      document_utf8: "---\nName: coregen.exe\nDescription: Binary coregen.exe (Microsoft CoreCLR Native\
        \ Image Generator) loads exported function GetCLRRuntimeHost from coreclr.dll or from .DLL in\
        \ arbitrary path. Coregen is located within \"C:\\Program Files (x86)\\Microsoft Silverlight\\\
        5.1.50918.0\\\" or another version of Silverlight. Coregen is signed by Microsoft and bundled\
        \ with Microsoft Silverlight.\nAuthor: Martin Sohn Christensen\nCreated: 2020-10-09\nCommands:\n\
        \  - Command: coregen.exe /L {PATH_ABSOLUTE:.dll} dummy_assembly_name\n    Description: Loads\
        \ the target .DLL in arbitrary path specified with /L.\n    Usecase: Execute DLL code\n    Category:\
        \ Execute\n    Privileges: User\n    MitreID: T1055\n    OperatingSystem: Windows\n    Tags:\n\
        \      - Execute: DLL\n  - Command: coregen.exe dummy_assembly_name\n    Description: Loads the\
        \ coreclr.dll in the corgen.exe directory (e.g. C:\\Program Files\\Microsoft Silverlight\\5.1.50918.0).\n\
        \    Usecase: Execute DLL code\n    Category: Execute\n    Privileges: User\n    MitreID: T1055\n\
        \    OperatingSystem: Windows\n    Tags:\n      - Execute: DLL\n  - Command: coregen.exe /L {PATH_ABSOLUTE:.dll}\
        \ dummy_assembly_name\n    Description: Loads the target .DLL in arbitrary path specified with\
        \ /L. Since binary is signed it can also be used to bypass application whitelisting solutions.\n\
        \    Usecase: Execute DLL code\n    Category: AWL Bypass\n    Privileges: User\n    MitreID: T1218\n\
        \    OperatingSystem: Windows\n    Tags:\n      - Execute: DLL\nFull_Path:\n  - Path: C:\\Program\
        \ Files\\Microsoft Silverlight\\5.1.50918.0\\coregen.exe\n  - Path: C:\\Program Files (x86)\\\
        Microsoft Silverlight\\5.1.50918.0\\coregen.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/b02e3b698afbaae143ac4fb36236eb0b41122ed7/rules/windows/image_load/image_load_side_load_coregen.yml\n\
        \  - IOC: coregen.exe loading .dll file not in \"C:\\Program Files (x86)\\Microsoft Silverlight\\\
        5.1.50918.0\\\"\n  - IOC: coregen.exe loading .dll file not named coreclr.dll\n  - IOC: coregen.exe\
        \ command line containing -L or -l\n  - IOC: coregen.exe command line containing unexpected/invald\
        \ assembly name\n  - IOC: coregen.exe application crash by invalid assembly name\nResources:\n\
        \  - Link: https://www.youtube.com/watch?v=75XImxOOInU\n  - Link: https://www.fireeye.com/blog/threat-research/2019/10/staying-hidden-on-the-endpoint-evading-detection-with-shellcode.html\n\
        Acknowledgement:\n  - Person: Nicky Tyrer\n  - Person: Evan Pena\n  - Person: Casey Erikson\n"
