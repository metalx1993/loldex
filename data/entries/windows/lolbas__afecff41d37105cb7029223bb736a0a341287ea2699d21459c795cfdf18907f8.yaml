      document_utf8: "---\nName: Bitsadmin.exe\nDescription: Used for managing background intelligent\
        \ transfer\nAuthor: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command: bitsadmin /create\
        \ 1 bitsadmin /addfile 1 c:\\windows\\system32\\cmd.exe c:\\data\\playfolder\\cmd.exe bitsadmin\
        \ /SetNotifyCmdLine 1 c:\\data\\playfolder\\1.txt:cmd.exe NULL bitsadmin /RESUME 1 bitsadmin /complete\
        \ 1\n    Description: Create a bitsadmin job named 1, add cmd.exe to the job, configure the job\
        \ to run the target command from an Alternate data stream, then resume and complete the job.\n\
        \    Usecase: Performs execution of specified file in the alternate data stream, can be used as\
        \ a defensive evasion or persistence technique.\n    Category: ADS\n    Privileges: User\n   \
        \ MitreID: T1564.004\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows\
        \ 10, Windows 11\n  - Command: bitsadmin /create 1 bitsadmin /addfile 1 https://live.sysinternals.com/autoruns.exe\
        \ c:\\data\\playfolder\\autoruns.exe bitsadmin /RESUME 1 bitsadmin /complete 1\n    Description:\
        \ Create a bitsadmin job named 1, add cmd.exe to the job, configure the job to run the target\
        \ command, then resume and complete the job.\n    Usecase: Download file from Internet\n    Category:\
        \ Download\n    Privileges: User\n    MitreID: T1105\n    OperatingSystem: Windows vista, Windows\
        \ 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n  - Command: bitsadmin /create 1 & bitsadmin\
        \ /addfile 1 c:\\windows\\system32\\cmd.exe c:\\data\\playfolder\\cmd.exe & bitsadmin /RESUME\
        \ 1 & bitsadmin /Complete 1 & bitsadmin /reset\n    Description: Command for copying cmd.exe to\
        \ another folder\n    Usecase: Copy file\n    Category: Copy\n    Privileges: User\n    MitreID:\
        \ T1105\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10\n \
        \ - Command: bitsadmin /create 1 & bitsadmin /addfile 1 c:\\windows\\system32\\cmd.exe c:\\data\\\
        playfolder\\cmd.exe & bitsadmin /SetNotifyCmdLine 1 c:\\data\\playfolder\\cmd.exe NULL & bitsadmin\
        \ /RESUME 1 & bitsadmin /Reset\n    Description: One-liner that creates a bitsadmin job named\
        \ 1, add cmd.exe to the job, configure the job to run the target command, then resume and complete\
        \ the job.\n    Usecase: Execute binary file specified. Can be used as a defensive evasion.\n\
        \    Category: Execute\n    Privileges: User\n    MitreID: T1218\n    OperatingSystem: Windows\
