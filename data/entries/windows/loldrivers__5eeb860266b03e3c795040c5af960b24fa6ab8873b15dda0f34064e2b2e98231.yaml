commands:
- template: sc.exe create KfeCo10X64.sys binPath=C:\windows\temp\KfeCo10X64.sys type=kernel && sc.exe
    start KfeCo10X64.sys
  comment: Killer exposes COM interfaces that allow non-privileged users 1) to block network for any process
    2) to manage any service in the OS. Killer is preinstalled to laptops equipped with Intel Killer NICs
    (e.g. Dell). Since Intel patched the vulnerability quietly, it's not clear which version is safe.
    Also, it is unclear which OEMs are affected. Dell is definitely in the list, but it is likely that
    other vendors with Killer NICs on board, such as Acer and MSI, are affected too. Some users think
    that Killer suite is required for the NIC to work properly, so they install it even after a fresh
    Windows install. This version is confirmed vulnerable based on the script usage from zwclose.
