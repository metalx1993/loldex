  comment: Cisco Talos has identified multiple versions of an undocumented malicious driver named “RedDriver,”
    a driver-based browser hijacker that uses the Windows Filtering Platform (WFP) to intercept browser
    traffic. RedDriver has been active since at least 2021. RedDriver utilizes HookSignTool to forge its
    signature timestamp to bypass Windows driver-signing policies. Code from multiple open-source tools
    has been used in the development of RedDriver's infection chain, including HP-Socket and a custom
    implementation of ReflectiveLoader. The authors of RedDriver appear to be skilled in driver development
    and have deep knowledge of the Windows operating system. This threat appears to target native Chinese
    speakers, as it searches for Chinese language browsers to hijack. Additionally, the authors are likely
    Chinese speakers themselves.
