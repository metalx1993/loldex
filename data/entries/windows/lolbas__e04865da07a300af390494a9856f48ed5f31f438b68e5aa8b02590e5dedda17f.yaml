      document_utf8: "---\nName: Sqlps.exe\nDescription: Tool included with Microsoft SQL Server that\
        \ loads SQL Server cmdlets. Microsoft SQL Server\\100 and 110 are Powershell v2. Microsoft SQL\
        \ Server\\120 and 130 are Powershell version 4. Replaced by SQLToolsPS.exe in SQL Server 2016,\
        \ but will be included with installation for compatability reasons.\nAuthor: Oddvar Moe\nCreated:\
        \ 2018-05-25\nCommands:\n  - Command: Sqlps.exe -noprofile\n    Description: Run a SQL Server\
        \ PowerShell mini-console without Module and ScriptBlock Logging.\n    Usecase: Execute PowerShell\
        \ commands without ScriptBlock logging.\n    Category: Execute\n    Privileges: User\n    MitreID:\
        \ T1218\n    OperatingSystem: Windows\n    Tags:\n      - Execute: PowerShell\nFull_Path:\n  -\
        \ Path: C:\\Program files (x86)\\Microsoft SQL Server\\100\\Tools\\Binn\\sqlps.exe\n  - Path:\
        \ C:\\Program files (x86)\\Microsoft SQL Server\\110\\Tools\\Binn\\sqlps.exe\n  - Path: C:\\Program\
        \ files (x86)\\Microsoft SQL Server\\120\\Tools\\Binn\\sqlps.exe\n  - Path: C:\\Program files\
        \ (x86)\\Microsoft SQL Server\\130\\Tools\\Binn\\sqlps.exe\n  - Path: C:\\Program Files (x86)\\\
        Microsoft SQL Server\\150\\Tools\\Binn\\SQLPS.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/683b63f8184b93c9564c4310d10c571cbe367e1e/rules/windows/process_creation/proc_creation_win_mssql_sqlps_susp_execution.yml\n\
