        \ counter measures\n    Category: ADS\n    Privileges: User\n    MitreID: T1564.004\n    OperatingSystem:\
        \ Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n  - Command: print\
        \ /D:{PATH_ABSOLUTE:.dest.exe} {PATH_ABSOLUTE:.source.exe}\n    Description: Copy file from source\
