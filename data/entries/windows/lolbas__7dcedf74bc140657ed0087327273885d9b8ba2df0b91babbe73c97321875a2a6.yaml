      document_utf8: "---\nName: Dxcap.exe\nDescription: DirectX diagnostics/debugger included with Visual\
        \ Studio.\nAuthor: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command: Dxcap.exe -c {PATH_ABSOLUTE:.exe}\n\
        \    Description: 'Launch specified executable as a subprocess of dxcap.exe. Note that you should\
        \ have write permissions in the current working directory for the command to succeed; alternatively,\
        \ add ''-file c:\\path\\to\\writable\\location.ext'' as first argument.'\n    Usecase: Local execution\
        \ of a process as a subprocess of dxcap.exe\n    Category: Execute\n    Privileges: User\n   \
        \ MitreID: T1127\n    OperatingSystem: Windows\n    Tags:\n      - Execute: EXE\n  - Command:\
        \ dxcap.exe -usage\n    Description: Once executed, `dxcap.exe` will execute `xperf.exe` in the\
        \ same folder. Thus, if `dxcap.exe` is copied to a folder and an arbitrary executable is renamed\
        \ to `xperf.exe`, `dxcap.exe` will spawn it.\n    Usecase: Execute an arbitrary executable via\
        \ trusted system executable.\n    Category: Execute\n    Privileges: User\n    MitreID: T1127\n\
        \    OperatingSystem: Windows 10, Windows 11\n    Tags:\n      - Execute: EXE\n      - Requires:\
        \ Rename\nFull_Path:\n  - Path: C:\\Windows\\System32\\dxcap.exe\n  - Path: C:\\Windows\\SysWOW64\\\
        dxcap.exe\nCode_Sample:\n  - Code: https://gist.github.com/ghosts621/1d0e0f43f7288c826035d5d011b6ca51\n\
        Detection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/683b63f8184b93c9564c4310d10c571cbe367e1e/rules/windows/process_creation/proc_creation_win_lolbin_susp_dxcap.yml\n\
        \  - IOC: dxcap.exe executing from outside of System32/SysWOW64\n  - IOC: dxcap.exe spawning Xperf.exe\n\
        \  - IOC: Xperf.exe executing from unusual directories (if not running from ADK path)\nResources:\n\
        \  - Link: https://twitter.com/harr0ey/status/992008180904419328\nAcknowledgement:\n  - Person:\
        \ Matt harr0ey\n    Handle: '@harr0ey'\n  - Person: Vikas Singh\n    Handle: '@vikas891'\n  -\
        \ Person: Naor Evgi\n    Handle: '@ghosts621'\n"
