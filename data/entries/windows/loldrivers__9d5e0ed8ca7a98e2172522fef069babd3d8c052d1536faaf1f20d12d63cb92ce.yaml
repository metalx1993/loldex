commands:
- template: sc.exe create Sxav binPath= C:\windows\temp\sxav64-v1.5.1.sys type= kernel start= system
  comment: The signed SXClient sxav.sys security driver processes an SXBOOTDB boot configuration whose
    integrity is protected only by an unkeyed MD5 digest. Public research demonstrates that an administrator
    can generate a valid configuration containing arbitrary absolute paths, point the service to it, and
    have the kernel driver delete those files during the next boot. The primitive can be abused to remove
    security-product files that are otherwise locked while Windows is running.
