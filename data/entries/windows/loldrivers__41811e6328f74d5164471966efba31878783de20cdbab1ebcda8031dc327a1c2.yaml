  sha256: 611b3ba687b7f46319a19609605ddfe5225e6d85277d8e923eea3fdb6f7b5b61
  signer: CnCrypt Foundation
  original_filename: Alinubx.sys
  command_metadata:
  - Command: ''
    Description: Alinubx.sys exposes IOCTL 0x222024 to request kernel-mode process termination through
      the device path \\.\Alinubx. The handler requires an eight-byte input containing a PID (DWORD) and
      exit status (DWORD), and passes both to a helper using PsLookupProcessByProcessId, ObOpenObjectByPointer,
      and ZwTerminateProcess. Access requires the driver to be loaded and its device to be accessible;
      successful termination of protected processes is not established. Abused by the Cruciferra MaaS
      loader to target AV/EDR processes.
    OperatingSystem: Windows
    Privileges: kernel
    Usecase: Terminate AV/EDR processes from kernel mode (BYOVD)
  category: vulnerable driver
