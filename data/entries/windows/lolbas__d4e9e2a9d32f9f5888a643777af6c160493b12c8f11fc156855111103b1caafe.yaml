      document_utf8: "---\nName: Findstr.exe\nDescription: Write to ADS, discover, or download files with\
        \ Findstr.exe\nAuthor: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command: findstr /V /L\
        \ W3AllLov3LolBas {PATH_ABSOLUTE:.exe} > {PATH_ABSOLUTE}:file.exe\n    Description: Searches for\
        \ the string W3AllLov3LolBas, since it does not exist (/V) the specified .exe file is written\
        \ to an Alternate Data Stream (ADS) of the specified target file.\n    Usecase: Add a file to\
        \ an alternate data stream to hide from defensive counter measures\n    Category: ADS\n    Privileges:\
        \ User\n    MitreID: T1564.004\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows\
        \ 8.1, Windows 10, Windows 11\n  - Command: findstr /V /L W3AllLov3LolBas {PATH_SMB:.exe} > {PATH_ABSOLUTE}:file.exe\n\
        \    Description: Searches for the string W3AllLov3LolBas, since it does not exist (/V) file.exe\
        \ is written to an Alternate Data Stream (ADS) of the file.txt file.\n    Usecase: Add a file\
        \ to an alternate data stream from a webdav server to hide from defensive counter measures\n \
        \   Category: ADS\n    Privileges: User\n    MitreID: T1564.004\n    OperatingSystem: Windows\
        \ vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n  - Command: findstr /S /I\
        \ cpassword \\\\sysvol\\policies\\*.xml\n    Description: Search for stored password in Group\
        \ Policy files stored on SYSVOL.\n    Usecase: Find credentials stored in cpassword attrbute\n\
        \    Category: Credentials\n    Privileges: User\n    MitreID: T1552.001\n    OperatingSystem:\
        \ Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n  - Command: findstr\
        \ /V /L W3AllLov3LolBas {PATH_SMB:.exe} > {PATH_ABSOLUTE:.exe}\n    Description: Searches for\
        \ the string W3AllLov3LolBas, since it does not exist (/V) file.exe is downloaded to the target\
        \ file.\n    Usecase: Download/Copy file from webdav server\n    Category: Download\n    Privileges:\
        \ User\n    MitreID: T1105\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows\
        \ 8.1, Windows 10, Windows 11\nFull_Path:\n  - Path: C:\\Windows\\System32\\findstr.exe\n  - Path:\
        \ C:\\Windows\\SysWOW64\\findstr.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/c04bef2fbbe8beff6c7620d5d7ea6872dbe7acba/rules/windows/process_creation/proc_creation_win_lolbin_findstr.yml\n\
