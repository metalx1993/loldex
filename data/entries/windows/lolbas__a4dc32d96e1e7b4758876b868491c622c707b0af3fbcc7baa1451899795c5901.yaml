        \ parent process.\n    Category: Download\n    Privileges: User\n    MitreID: T1105\n    OperatingSystem:\
        \ Windows\n    Tags:\n      - Download: INetCache\n  - Command: VSLaunchBrowser.exe .exe {PATH_ABSOLUTE:.exe}\n\
        \    Description: Execute payload via VSLaunchBrowser as parent process\n    Usecase: It will\
        \ open a local file using the default app associated with the supplied file extension with VSLaunchBrowser\
        \ as parent process.\n    Category: Execute\n    Privileges: User\n    MitreID: T1127\n    OperatingSystem:\
        \ Windows\n    Tags:\n      - Execute: EXE\n  - Command: VSLaunchBrowser.exe .exe {PATH_SMB}\n\
