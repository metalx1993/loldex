        \ 940 /o {PATH_ABSOLUTE:folder} /fullmemdmp /wait 1\n    Description: Dump process by PID and\
        \ create a dump file (creates files called `minidump_<PID>.dmp` and `results_<PID>.hlk`).\n  \
        \  Usecase: Dump process by PID.\n    Category: Dump\n    Privileges: User\n    MitreID: T1003\n\
        \    OperatingSystem: Windows\n  - Command: rdrleakdiag.exe /p 832 /o {PATH_ABSOLUTE:folder} /fullmemdmp\
        \ /wait 1\n    Description: Dump LSASS process by PID and create a dump file (creates files called\
        \ `minidump_<PID>.dmp` and `results_<PID>.hlk`).\n    Usecase: Dump LSASS process.\n    Category:\
        \ Dump\n    Privileges: Administrator\n    MitreID: T1003.001\n    OperatingSystem: Windows\n\
        \  - Command: rdrleakdiag.exe /p 832 /o {PATH_ABSOLUTE:folder} /fullmemdmp /snap\n    Description:\
