        {CMD}\"\n    Description: Executes executable from bash.exe\n    Usecase: Performs execution of\
        \ specified file, can be used to bypass Application Whitelisting.\n    Category: AWL Bypass\n\
        \    Privileges: User\n    MitreID: T1202\n    OperatingSystem: Windows 10\n    Tags:\n      -\
        \ Execute: CMD\n  - Command: bash.exe\n    Description: When executed, `bash.exe` queries the\
        \ registry value of `HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Lxss\\MSI\\InstallLocation`,\
        \ which contains a folder path (`c:\\program files\\wsl` by default). If the value points to another\
        \ folder containing a file named `wsl.exe`, it will be executed instead of the legitimate `wsl.exe`\
        \ in the program files folder.\n    Usecase: Execute a payload as a child process of `bash.exe`\
        \ while masquerading as WSL.\n    Category: Execute\n    Privileges: User\n    MitreID: T1218\n\
        \    OperatingSystem: Windows 10, Windows Server 2019, Windows 11\n    Tags:\n      - Execute:\
        \ CMD\nFull_Path:\n  - Path: C:\\Windows\\System32\\bash.exe\n  - Path: C:\\Windows\\SysWOW64\\\
