  command_metadata:
  - Command: ''
    Description: DCRCVDrv.sys exposes IOCTL 0x2205C0 to request kernel-mode process termination for a
      caller-supplied PID. The handler requires at least four input bytes and reaches ZwTerminateProcess
      through a process-handle acquisition helper. Access requires the driver to be loaded and its device
      to be accessible; successful termination of protected processes is not established. Abused by the
      Cruciferra MaaS loader, which writes the driver to C:\Windows\Temp\DCRCVDrv.sys, creates a service
      for it, and opens a handle via the symbolic link \\.\DCRCVDRV_U to kill AV/EDR processes. Also observed
      in-the-wild in the ClearFake/Amatera infection chain, where Chrome's platform_experience_helper.exe
      sideloaded a malicious Secur32.dll, which loaded DCRCVDrv.sys to terminate EDR processes via IOCTL
      0x2205C0.
    OperatingSystem: Windows
    Privileges: kernel
    Usecase: Terminate AV/EDR processes from kernel mode (BYOVD)
  category: vulnerable driver
