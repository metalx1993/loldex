      command_source_index: 0
      document_utf8: "---\nName: ComputerDefaults.exe\nDescription: ComputerDefaults.exe is a Windows\
        \ system utility for managing default applications for tasks like web browsing, emailing, and\
        \ media playback.\nAuthor: Eron Clarke\nCreated: 2024-09-24\nCommands:\n  - Command: ComputerDefaults.exe\n\
        \    Description: Upon execution, ComputerDefaults.exe checks two registry values at HKEY_CURRENT_USER\\\
        Software\\Classes\\ms-settings\\Shell\\open\\command; if these are set by an attacker, the set\
        \ command will be executed as a high-integrity process without a UAC prompt being displayed to\
        \ the user. See 'resources' for which registry keys/values to set.\n    Usecase: Execute a binary\
        \ or script as a high-integrity process without a UAC prompt.\n    Category: UAC Bypass\n    Privileges:\
        \ User\n    MitreID: T1548.002\n    OperatingSystem: Windows 10, Windows 11\nFull_Path:\n  - Path:\
        \ C:\\Windows\\System32\\ComputerDefaults.exe\n  - Path: C:\\Windows\\SysWOW64\\ComputerDefaults.exe\n\
        Detection:\n  - IOC: Event ID 10\n  - IOC: A binary or script spawned as a child process of ComputerDefaults.exe\n\
        \  - IOC: Changes to HKEY_CURRENT_USER\\Software\\Classes\\ms-settings\\Shell\\open\\command\n\
        \  - Sigma: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_uac_bypass_computerdefaults.yml\n\
        Resources:\n  - Link: https://gist.github.com/havoc3-3/812547525107bd138a1a839118a3a44b\nAcknowledgement:\n\
        \  - Person: Eron Clarke\n"
