  - Command: sc.exe create zntport binPath= C:\windows\temp\zntport.sys type= kernel && sc.exe start zntport
    Description: The legacy NTPort driver creates the "\\.\zntport" device and exposes IOCTL 0xF10024CC
      with FILE_ANY_ACCESS. The handler accepts a caller-controlled 32-bit physical address, maps 0x32
      bytes below 4 GiB with MmMapIoSpace, and copies data through an unchecked strcpy operation. After
      an administrator installs the driver, an unprivileged process may be able to abuse the device for
      physical-memory disclosure or memory corruption, depending on the device ACL.
    Usecase: Read physical memory below 4 GiB or trigger memory corruption through the unchecked copy
      operation.
    Privileges: Administrator required to install; device access may be available to unprivileged users
      after installation
