commands:
- template: sc.exe create STProcessMonitor binPath=C:\windows\temp\STProcessMonitor.sys type=kernel &&
    sc.exe start STProcessMonitor
  comment: Safetica STProcessMonitor / ProcessMonitorDriver.sys exposes process-termination functionality
    through vulnerable IOCTL paths documented in public BYOVD research. The tracked samples include the
    11.26.18.0 build and the legacy 11.11.4.0 build; public research notes that affected versions can
    be abused to terminate endpoint security processes from kernel context. IronChain ransomware bundles
    the 11.26.18 sample, but per ANY.RUN's static analysis its request (IOCTL 0xB822200C, 4-byte input)
    does not match the driver's expected 0xB822A00C with at least 8 bytes, so the kill path fails.
