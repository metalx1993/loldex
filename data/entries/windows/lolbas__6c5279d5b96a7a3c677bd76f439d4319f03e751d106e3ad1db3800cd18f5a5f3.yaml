      document_utf8: "---\nName: Sqldumper.exe\nDescription: Debugging utility included with Microsoft\
        \ SQL.\nAuthor: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command: sqldumper.exe 464 0 0x0110\n\
        \    Description: Dump process by PID and create a dump file (Appears to create a dump file called\
        \ SQLDmprXXXX.mdmp).\n    Usecase: Dump process using PID.\n    Category: Dump\n    Privileges:\
        \ Administrator\n    MitreID: T1003\n    OperatingSystem: Windows\n  - Command: sqldumper.exe\
        \ 540 0 0x01100:40\n    Description: 0x01100:40 flag will create a Mimikatz compatible dump file.\n\
        \    Usecase: Dump LSASS.exe to Mimikatz compatible dump using PID.\n    Category: Dump\n    Privileges:\
        \ Administrator\n    MitreID: T1003.001\n    OperatingSystem: Windows\nFull_Path:\n  - Path: C:\\\
        Program Files\\Microsoft SQL Server\\90\\Shared\\SQLDumper.exe\n  - Path: C:\\Program Files (x86)\\\
        Microsoft Office\\root\\vfs\\ProgramFilesX86\\Microsoft Analysis\\AS OLEDB\\140\\SQLDumper.exe\n\
        \  - Path: C:\\Program Files\\Microsoft Power BI Desktop\\bin\\SqlDumper.exe\nDetection:\n  -\
        \ Sigma: https://github.com/SigmaHQ/sigma/blob/683b63f8184b93c9564c4310d10c571cbe367e1e/rules/windows/process_creation/proc_creation_win_lolbin_susp_sqldumper_activity.yml\n\
