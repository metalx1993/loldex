      document_utf8: "---\nName: Fsutil.exe\nDescription: File System Utility\nAuthor: Elliot Killick\n\
        Created: 2021-08-16\nCommands:\n  - Command: fsutil.exe file setZeroData offset=0 length=9999999999\
        \ {PATH_ABSOLUTE}\n    Description: Zero out a file\n    Usecase: Can be used to forensically\
        \ erase a file\n    Category: Tamper\n    Privileges: User\n    MitreID: T1485\n    OperatingSystem:\
        \ Windows XP, Windows Vista, Windows 7, Windows 8, Windows 8.1, Windows 10\n  - Command: 'fsutil.exe\
        \ usn deletejournal /d c:'\n    Description: Delete the USN journal volume to hide file creation\
        \ activity\n    Usecase: Can be used to hide file creation activity\n    Category: Tamper\n  \
        \  Privileges: User\n    MitreID: T1485\n    OperatingSystem: Windows XP, Windows Vista, Windows\
        \ 7, Windows 8, Windows 8.1, Windows 10\n  - Command: fsutil.exe trace decode\n    Description:\
        \ Executes a pre-planted binary named netsh.exe from the current directory.\n    Usecase: Spawn\
        \ a pre-planted executable from fsutil.exe.\n    Category: Execute\n    Privileges: User\n   \
        \ MitreID: T1218\n    OperatingSystem: Windows 11\n    Tags:\n      - Execute: EXE\n  - Command:\
        \ fsutil.exe file createnew {PATH_ABSOLUTE} {LENGTH_IN_BYTES}\n    Description: Instantly creates\
        \ a new file of any specified size to exhaust free disk space.\n    Usecase: Exhaust available\
        \ disk space to impair defensive tools (preventing Windows Defender updates and halting local\
        \ logging) or cause endpoint denial of service.\n    Category: Tamper\n    Privileges: User\n\
        \    MitreID: T1562.001\n    OperatingSystem: Windows XP, Windows Vista, Windows 7, Windows 8,\
        \ Windows 8.1, Windows 10, Windows 11\nFull_Path:\n  - Path: C:\\Windows\\System32\\fsutil.exe\n\
        \  - Path: C:\\Windows\\SysWOW64\\fsutil.exe\nDetection:\n  - IOC: fsutil.exe should not be run\
        \ on a normal workstation\n  - IOC: file setZeroData (not case-sensitive) in the process arguments\n\
        \  - IOC: file createnew (not case-sensitive) in the process arguments\n  - IOC: Sysmon Event\
        \ ID 1\n  - IOC: Sysmon Event ID 11\n  - IOC: Execution of process fsutil.exe with trace decode\
        \ could be suspicious\n  - IOC: Non-Windows netsh.exe execution\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/ff5102832031425f6eed011dd3a2e62653008c94/rules/windows/process_creation/proc_creation_win_susp_fsutil_usage.yml\n\
