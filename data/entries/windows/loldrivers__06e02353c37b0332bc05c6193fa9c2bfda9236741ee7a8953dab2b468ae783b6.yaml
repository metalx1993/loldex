commands:
- template: pnputil /add-driver fdu11.cat && sc.exe create ngstar binPath=C:\windows\temp\NGStar.sys type=kernel
    && sc.exe start ngstar
  comment: 'NGStar.sys is the kernel-mode USB fingerprint sensor driver for NITGEN Fingkey Hamster II/III
    devices. The driver creates \Device\gstar-0 exposed as \\.\gstar-0 via IoCreateDevice with FILE_DEVICE_UNKNOWN
    and no IoCreateDeviceSecure call, making all 28 IOCTL codes (0x00222004-0x00222070) reachable by any
    unprivileged user-mode process (FILE_ANY_ACCESS on all codes). IOCTLs 0x0022206C and 0x00222070 allocate
    a fixed 10-byte NonPagedPool block via the deprecated ExAllocatePool API then pass it directly as
    the receive buffer for an uncapped USB bulk transfer with no post-transfer bounds check — kernel pool
    overflow leading to local privilege escalation to SYSTEM. ExAllocatePool (non-tagged, removed from
    Windows 11 and Server 2022 kernel exports) causes a kernel bugcheck (BSOD) on any IOCTL reaching the
    allocation path — confirmed local DoS. IOCTL 0x00222050 decrements a session reference counter at
    [rbp+0x40] via lock add without an underflow guard; counter wraps to 0xFFFFFFFF from zero, corrupting
    the device extension refcount and triggering premature cleanup leading to use-after-free. Driver carries
    no embedded PE signature; trusted via catalog fdu11.cat (VeriSign-signed, expired 2014, valid via
    timestamp countersignature). VT detection: 0/77.'
