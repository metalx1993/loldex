      document_utf8: "---\nName: winget.exe\nDescription: Windows Package Manager tool\nAuthor: Paul Sanders\n\
        Created: 2022-01-03\nCommands:\n  - Command: winget.exe install --manifest {PATH:.yml}\n    Description:\
        \ 'Downloads a file from the web address specified in .yml file and executes it on the system.\
        \ Local manifest setting must be enabled in winget for it to work: `winget settings --enable LocalManifestFiles`'\n\
        \    Usecase: Download and execute an arbitrary file from the internet\n    Category: Execute\n\
        \    Privileges: Local Administrator - required to enable local manifest setting\n    MitreID:\
        \ T1105\n    OperatingSystem: Windows 10, Windows 11\n    Tags:\n      - Execute: Remote\n   \
        \   - Execute: EXE\n  - Command: winget.exe install --accept-package-agreements -s msstore {name\
        \ or ID}\n    Description: 'Download and install any software from the Microsoft Store using its\
        \ name or Store ID, even if the Microsoft Store App itself is blocked on the machine. For example,\
        \ use \"Sysinternals Suite\" or `9p7knl5rwt25` for obtaining ProcDump, PsExec via the Sysinternals\
        \ Suite. Note: a Microsoft account is required for this.'\n    Usecase: Download and install software\
        \ from Microsoft Store, even if Microsoft Store App is blocked\n    Category: Download\n    Privileges:\
        \ User\n    MitreID: T1105\n    OperatingSystem: Windows 10, Windows 11\n  - Command: winget.exe\
        \ install --accept-package-agreements -s msstore {name or ID}\n    Description: 'Download and\
        \ install any software from the Microsoft Store using its name or Store ID, even if the Microsoft\
        \ Store App itself is blocked on the machine, and even if AppLocker is active on the machine.\
        \ For example, use \"Sysinternals Suite\" or `9p7knl5rwt25` for obtaining ProcDump, PsExec via\
        \ the Sysinternals Suite. Note: a Microsoft account is required for this.'\n    Usecase: Download\
        \ and install software from Microsoft Store, even if Microsoft Store App is blocked, and AppLocker\
        \ is activated on the machine\n    Category: AWL Bypass\n    Privileges: User\n    MitreID: T1105\n\
        \    OperatingSystem: Windows 10, Windows 11\nFull_Path:\n  - Path: C:\\Users\\user\\AppData\\\
        Local\\Microsoft\\WindowsApps\\winget.exe\nCode_Sample:\n  - Code: https://gist.github.com/saulpanders/00e1177602a8c01a3a8bfa932b3886b0\n\
        Detection:\n  - IOC: winget.exe spawned with local manifest file\n  - IOC: Sysmon Event ID 1 -\
        \ Process Creation\n  - Analysis: https://saulpanders.github.io/2022/01/02/New-Year-New-LOLBAS.html\n\
