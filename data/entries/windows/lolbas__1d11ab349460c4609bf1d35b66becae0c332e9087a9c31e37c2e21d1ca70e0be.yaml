      document_utf8: "---\nName: Diantz.exe\nDescription: Binary that package existing files into a cabinet\
        \ (.cab) file\nAuthor: Tamir Yehuda\nCreated: 2020-08-08\nCommands:\n  - Command: diantz.exe {PATH_ABSOLUTE:.exe}\
        \ {PATH_ABSOLUTE}:targetFile.cab\n    Description: Compress a file (first argument) into a CAB\
        \ file stored in the Alternate Data Stream (ADS) of the target file.\n    Usecase: Hide data compressed\
        \ into an Alternate Data Stream.\n    Category: ADS\n    Privileges: User\n    MitreID: T1564.004\n\
        \    OperatingSystem: Windows XP, Windows vista, Windows 7, Windows 8, Windows 8.1.\n    Tags:\n\
        \      - Type: Compression\n  - Command: diantz.exe {PATH_SMB:.exe} {PATH_ABSOLUTE:.cab}\n   \
        \ Description: Download and compress a remote file and store it in a CAB file on local machine.\n\
        \    Usecase: Download and compress into a cab file.\n    Category: Download\n    Privileges:\
        \ User\n    MitreID: T1105\n    OperatingSystem: Windows Server 2012, Windows Server 2012R2, Windows\
        \ Server 2016, Windows Server 2019\n    Tags:\n      - Type: Compression\n  - Command: diantz\
        \ /f {PATH:.ddf}\n    Description: Execute diantz directives as defined in the specified Diamond\
        \ Definition File (.ddf); see resources for the format specification.\n    Usecase: Bypass command-line\
        \ based detections\n    Category: Execute\n    Privileges: User\n    MitreID: T1036\n    OperatingSystem:\
        \ Windows Server 2012, Windows Server 2012R2, Windows Server 2016, Windows Server 2019\n    Tags:\n\
        \      - Type: Compression\nFull_Path:\n  - Path: c:\\windows\\system32\\diantz.exe\n  - Path:\
        \ c:\\windows\\syswow64\\diantz.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/process_creation/proc_creation_win_lolbin_diantz_ads.yml\n\
        \  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/process_creation/proc_creation_win_lolbin_diantz_remote_cab.yml\n\
        \  - IOC: diantz storing data into alternate data streams.\n  - IOC: diantz getting a file from\
        \ a remote machine or the internet.\nResources:\n  - Link: https://docs.microsoft.com/en-us/windows-server/administration/windows-commands/diantz\n\
