      document_utf8: "---\nName: Mofcomp.exe\nDescription: Compiler that parses a file containing MOF\
        \ statements and adds the classes and class instances defined in the file to the WMI repository.\
        \ Threat actors can leverage this binary to install malicious MOF scripts\nAuthor: Daniel Gott\n\
        Created: 2022-07-19\nCommands:\n  - Command: mofcomp.exe {PATH_ABSOLUTE:.mof}\n    Description:\
        \ Abuse of mofcomp.exe to parse a file which contains MOF statements in order create new classes\
        \ as part of the WMI repository\n    Usecase: Threat actors can use mofcomp.exe to register a\
        \ malicious MOF file as a new class in the WMI repository\n    Category: Execute\n    Privileges:\
        \ User\n    MitreID: T1047\n    OperatingSystem: Windows Vista, Windows 7, Windows 8, Windows\
        \ 8.1, Windows 10, Windows 11, Windows Server 2008+\n    Tags:\n      - Execute: MOF\nFull_Path:\n\
        \  - Path: C:\\Windows\\System32\\wbem\\mofcomp.exe\n  - Path: C:\\Windows\\SysWOW64\\wbem\\mofcomp.exe\n\
        Detection:\n  - IOC: strange parent processes spawning mofcomp.exe like cmd.exe or powershell.exe\n\
        \  - Sigma: https://github.com/The-DFIR-Report/Sigma-Rules/blob/75260568a7ffe61b2458ca05f6f25914efb44337/win_mofcomp_execution.yml\n\
        Resources:\n  - Link: https://docs.microsoft.com/en-us/windows/win32/wmisdk/mofcomp\n  - Link:\
        \ https://docs.microsoft.com/en-us/windows/win32/wmisdk/managed-object-format--mof-\n  - Link:\
        \ https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/\n  - Link: https://in.security/2019/04/03/an-intro-into-abusing-and-identifying-wmi-event-subscriptions-for-persistence/\n\
        \  - Link: https://medium.com/threatpunter/detecting-removing-wmi-persistence-60ccbb7dff96\nAcknowledgement:\n\
        \  - Person: Daniel Gott\n    Handle: '@gott_cyber'\n  - Person: The DFIR Report\n    Handle:\
        \ '@TheDFIRReport'\n  - Person: Nasreddine Bencherchali\n    Handle: '@nas_bench'\n"
