  command_metadata:
  - Command: sc.exe create AccelLid.sys binPath=C:\windows\temp\AccelLid.sys type=kernel && sc.exe start
      AccelLid.sys
    Description: AccelLid.sys is an Elitegroup Computer Systems lid accelerometer kernel driver. Northwave
      Cyber Security reported a local denial-of-service vulnerability with a CVSSv3 score of 5.5. The
      driver exposes IOCTL paths for accelerometer commands, keyboard control, event registration, and
      ACPI method execution. Microsoft's vulnerable driver blocklist denies AccelLid.sys across all file
      versions for matching Elitegroup publisher and signing roots.
    Usecase: Trigger vulnerable AccelLid.sys IOCTL handling for local denial of service.
    Privileges: kernel
    OperatingSystem: Windows 10
  category: vulnerable driver
