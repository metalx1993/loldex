  comment: AccelLid.sys is an Elitegroup Computer Systems lid accelerometer kernel driver. Northwave Cyber
    Security reported a local denial-of-service vulnerability with a CVSSv3 score of 5.5. The driver exposes
    IOCTL paths for accelerometer commands, keyboard control, event registration, and ACPI method execution.
    Microsoft's vulnerable driver blocklist denies AccelLid.sys across all file versions for matching
    Elitegroup publisher and signing roots.
