      command_source_index: 2
      document_utf8: "---\nName: wsb.exe\nDescription: Windows Sandbox command-line interface. Creates,\
        \ lists, controls, and executes commands inside Windows Sandbox sessions from the host CLI.\n\
        Author: Konrad 'unrooted' Klawikowski\nCreated: 2026-05-28\nCommands:\n  - Command: |\n      wsb\
        \ start --config \"<Configuration><LogonCommand><Command>{CMD}</Command></LogonCommand></Configuration>\"\
        \n      wsb exec -r System --id YOUR_ID\n    Description: 'Executes the given command in a Windows\
        \ Sandbox from an inline XML configuration with an embedded `<LogonCommand>`, leaving no `.wsb`\
        \ file on disk. Note: `<LogonCommand>` only fires once `WDAGUtilityAccount` actually logs in,\
        \ which only happens after an RDP session is established via `wsb connect`, so this pattern opens\
        \ a visible Sandbox window.'\n    Usecase: Fileless execution of arbitrary commands in an EDR-free\
        \ environment whose host-side process tree is masked by the Sandbox client binaries.\n    Category:\
        \ Execute\n    Privileges: User\n    MitreID: T1564.006\n    OperatingSystem: Windows 11 24H2\
        \ and later\n    Tags:\n      - Execute: CMD\n\n  - Command: |\n        wsb start --config \"\
        <Configuration><MappedFolders><MappedFolder><HostFolder>{PATH_ABSOLUTE:folder}</HostFolder><ReadOnly>false</ReadOnly></MappedFolder></MappedFolders></Configuration>\"\
        \n        wsb exec -r System --id YOUR_ID -c \"cmd.exe /c copy C:\\users\\WDAGUtilityAccount\\\
        Desktop\\Temp\\{PATH} {PATH}\"\n    Description: 'Allows the specified folder to be accessible\
        \ from within the Windows Sandbox, mounted under `C:\\users\\WDAGUtilityAccount\\Desktop` with\
        \ the same folder name as the source folder. This allows, for example, for copying payloads from\
        \ the host system into the sandbox (seen here), copying payloads from the sandbox back to the\
        \ host system, or for accessing arbitrary host system files by the sandbox.'\n    Usecase: Fileless\
        \ execution of arbitrary commands in an EDR-free environment, with access to files on the host\
        \ system, while the host-side process tree is masked by the Sandbox client binaries.\n    Category:\
        \ Execute\n    Privileges: User\n    MitreID: T1564.006\n    OperatingSystem: Windows 11 24H2\
        \ and later\n    Tags:\n      - Execute: CMD\n\n  - Command: |\n      wsb start\n      wsb share\
        \ --id YOUR_ID -f {PATH_ABSOLUTE:folder} -s c:\\SOME_FOLDER --allow-write\n      wsb exec -r System\
        \ --id YOUR_ID -c \"cmd.exe /c copy {PATH_ABSOLUTE} c:\\SOME_FOLDER\"\n    Description: 'Allows\
        \ the specified folder to be accessible from within the Windows Sandbox, mounted at `c:\\SOME_FOLDER`.\
        \ This allows, for example, for copying payloads from the host system into the sandbox, copying\
        \ payloads from the sandbox back to the host system (seen here), or for accessing arbitrary host\
        \ system files by the sandbox.'\n    Usecase: Fileless execution of arbitrary commands in an EDR-free\
        \ environment, with access to files on the host system, while the host-side process tree is masked\
        \ by the Sandbox client binaries.\n    Category: Execute\n    Privileges: User\n    MitreID: T1564.006\n\
        \    OperatingSystem: Windows 11 24H2 and later\n    Tags:\n      - Execute: CMD\n\nFull_Path:\n\
        \  - Path: C:\\Users\\<user>\\AppData\\Local\\Microsoft\\WindowsApps\\wsb.exe\n\nCode_Sample:\n\
        \  - Code: https://gist.github.com/unrooted/c02f398c88205a437ad2fb592b61efff\n\nDetection:\n \
        \ - IOC: wsb.exe command line containing --config with an embedded <LogonCommand> XML element\n\
        \  - IOC: wsb.exe command line invoking the share subcommand with --allow-write\n  - IOC: wsb.exe\
        \ command line invoking the exec subcommand with -r System\n  - IOC: WindowsSandboxServer.exe\
        \ spawns whenever a Sandbox session starts, regardless of whether anyone connects. Lives under\
        \ %ProgramFiles%\\WindowsApps\\MicrosoftWindows.WindowsSandbox_*\\.\n  - IOC: WindowsSandboxRemoteSession.exe\
        \ spawns ONLY when an RDP connection to the Sandbox is established - opening a .wsb file directly\
        \ auto-connects (so both processes appear), but `wsb start` alone does NOT spawn it. Its absence\
        \ while WindowsSandboxServer.exe is alive means no user has connected.\n  - IOC: (highest-signal\
        \ for headless abuse) WindowsSandboxServer.exe present WITHOUT WindowsSandboxRemoteSession.exe\
        \ indicates a Sandbox VM is running with no interactive session. Legitimate usage almost always\
        \ involves an RDP connection (because users want to use the Sandbox); a server-without-remote-session\
        \ state is consistent with the `wsb exec -r System` headless attack primitive.\n  - IOC: vmwp.exe\
        \ and vmmemWindowsSandbox spawned alongside wsb.exe activity indicate the Sandbox VM is up (vmwp\
        \ is the Hyper-V worker hosting the Sandbox VM)\n  - IOC: Host-side file-creation events on paths\
        \ corresponding to a mapped folder, attributed to vmwp.exe (Hyper-V worker), with timestamps inside\
        \ the lifetime of an active Sandbox session - empirically verified on Windows 11 24H2 via Process\
        \ Monitor; this is how a sandbox-to-host cross-boundary write surfaces from host telemetry\n \
        \ - IOC: Microsoft-Windows-Sandbox-Client-Diagnostics/Admin event log entries for Sandbox lifecycle\
        \ events correlated with wsb.exe invocations\n\nResources:\n  - Link: https://web.archive.org/web/20250116184008/http://blog.syscall.party/2020/12/02/weaponizing-windows-sandbox.html\n\
        \  - Link: https://github.com/LloydLabs/wsb-detect\n  - Link: https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/windows-sandbox-cli\n\
        \  - Link: https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/windows-sandbox-versions\n\
        \  - Link: https://github.com/secdev02/SandBoxShenanigans\n\nAcknowledgement:\n  - Person: Konrad\
        \ 'unrooted' Klawikowski\n  - Person: Lloyd Davies\n    Handle: '@LloydLabs'\n"
