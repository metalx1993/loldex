commands:
- template: sc.exe create KKYUM binPath=C:\windows\temp\KKYUM.sys type=kernel && sc.exe start KKYUM
  comment: The driver creates a device object named "\\.\KKYUM" without strict access controls, allowing
    low-privileged users to interact with it. It exposes unauthenticated IOCTL control codes "0x22265C"
    (Read) and "0x222658" (Write) that encapsulate the MmCopyVirtualMemory kernel API. The handler accepts
    a target Process ID (PID) and a structured array of source/destination virtual addresses directly
    from user space without checking execution privileges, enabling local attackers to perform unauthorized
    arbitrary process memory reads and writes against any active process.
