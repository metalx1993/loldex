        \ Can be used to evade defensive countermeasures, or to hide as part of a persistence mechanism\n\
        \    Category: ADS\n    Privileges: User\n    MitreID: T1564.004\n    OperatingSystem: Windows\
        \ 10, Windows 11\n    Tags:\n      - Type: Compression\n  - Command: tar -xf {PATH}:ads\n    Description:\
        \ Decompress a compressed file from an alternate data stream (ADS).\n    Usecase: Can be used\
        \ to evade defensive countermeasures, or to hide as part of a persistence mechanism\n    Category:\
        \ ADS\n    Privileges: User\n    MitreID: T1564.004\n    OperatingSystem: Windows 10, Windows\
        \ 11\n    Tags:\n      - Type: Compression\n  - Command: tar -xf {PATH_SMB:.tar}\n    Description:\
        \ Extracts archive.tar from the remote (internal) host to the current host.\n    Usecase: Copy\
        \ files\n    Category: Copy\n    Privileges: User\n    MitreID: T1105\n    OperatingSystem: Windows\
        \ 10, Windows 11\n    Tags:\n      - Type: Compression\nFull_Path:\n  - Path: C:\\Windows\\System32\\\
