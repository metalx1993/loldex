        \ Windows vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      -\
        \ Execute: CSharp\n  - Command: msbuild.exe {PATH:.csproj}\n    Description: Build and execute\
        \ a C# project stored in the target csproj file.\n    Usecase: Compile and run code\n    Category:\
        \ Execute\n    Privileges: User\n    MitreID: T1127.001\n    OperatingSystem: Windows vista, Windows\
        \ 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      - Execute: CSharp\n  - Command:\
        \ msbuild.exe /logger:TargetLogger,{PATH_ABSOLUTE:.dll};MyParameters,Foo\n    Description: Executes\
        \ generated Logger DLL file with TargetLogger export.\n    Usecase: Execute DLL\n    Category:\
        \ Execute\n    Privileges: User\n    MitreID: T1127.001\n    OperatingSystem: Windows vista, Windows\
        \ 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      - Execute: DLL\n  - Command:\
        \ msbuild.exe {PATH:.proj}\n    Description: Execute JScript/VBScript code through XML/XSL Transformation.\
