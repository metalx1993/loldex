      document_utf8: "---\nName: iscsicpl.exe\nDescription: Microsoft iSCSI Initiator Control Panel tool\n\
        Author: Ekitji\nCreated: 2025-08-17\nCommands:\n  - Command: c:\\windows\\syswow64\\iscsicpl.exe\
        \  # SysWOW64 binary\n    Description: c:\\windows\\syswow64\\iscsicpl.exe has a DLL injection\
        \ through `C:\\Users\\<username>\\AppData\\Local\\Microsoft\\WindowsApps\\ISCSIEXE.dll`, resulting\
        \ in UAC bypass.\n    Usecase: Execute a custom DLL via a trusted high-integrity process without\
        \ a UAC prompt.\n    Category: UAC Bypass\n    Privileges: User\n    MitreID: T1548.002\n    OperatingSystem:\
        \ Windows 10, Windows 11\n    Tags:\n      - Execute: DLL\n  - Command: iscsicpl.exe  # SysWOW64/System32\
        \ binary\n    Description: Both `c:\\windows\\system32\\iscsicpl.exe` and `c:\\windows\\system64\\\
        iscsicpl.exe` have UAC bypass through launching iscicpl.exe, then navigating into the Configuration\
        \ tab, clicking Report, then launching your custom command.\n    Usecase: Execute a binary or\
        \ script as a high-integrity process without a UAC prompt.\n    Category: UAC Bypass\n    Privileges:\
        \ User\n    MitreID: T1548.002\n    OperatingSystem: Windows 10, Windows 11\n    Tags:\n     \
        \ - Execute: CMD\n      - Application: GUI\nFull_Path:\n  - Path: c:\\windows\\system32\\iscsicpl.exe\
        \  # UAC Bypass by breaking out from application\n  - Path: c:\\windows\\syswow64\\iscsicpl.exe\
        \  # UAC Bypass by DLL injection and breakout from application\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_uac_bypass_iscsicpl.yml\n\
        \  - IOC: C:\\Users\\<username>\\AppData\\Local\\Microsoft\\WindowsApps\\ISCSIEXE.dll\n  - IOC:\
        \ Suspicious child process to iscsicpl.exe like cmd, powershell etc.\nResources:\n  - Link: https://learn.microsoft.com/en-us/windows-server/storage/iscsi/iscsi-initiator-portal\n\
        \  - Link: https://github.com/hackerhouse-opensource/iscsicpl_bypassUAC\nAcknowledgement:\n  -\
        \ Person: hacker.house\n  - Person: Ekitji\n    Handle: '@eki_erk'\n"
