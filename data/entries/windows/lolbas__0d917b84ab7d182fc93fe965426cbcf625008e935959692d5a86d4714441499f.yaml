      document_utf8: "---\nName: Eventvwr.exe\nDescription: Displays Windows Event Logs in a GUI window.\n\
        Author: Jacob Gajek\nCreated: 2018-11-01\nCommands:\n  - Command: eventvwr.exe\n    Description:\
        \ During startup, eventvwr.exe checks the registry value `HKCU\\Software\\Classes\\mscfile\\shell\\\
        open\\command` for the location of mmc.exe, which is used to open the eventvwr.msc saved console\
        \ file. If the location of another binary or script is added to this registry value, it will be\
        \ executed as a high-integrity process without a UAC prompt being displayed to the user.\n   \
        \ Usecase: Execute a binary or script as a high-integrity process without a UAC prompt.\n    Category:\
        \ UAC Bypass\n    Privileges: User\n    MitreID: T1548.002\n    OperatingSystem: Windows vista,\
        \ Windows 7, Windows 8, Windows 8.1, Windows 10\n    Tags:\n      - Application: GUI\n      -\
        \ Execute: EXE\n  - Command: ysoserial.exe -o raw -f BinaryFormatter - g DataSet -c \"{CMD}\"\
        \ > RecentViews & copy RecentViews %LOCALAPPDATA%\\Microsoft\\EventV~1\\RecentViews & eventvwr.exe\n\
        \    Description: During startup, eventvwr.exe uses .NET deserialization with `%LOCALAPPDATA%\\\
        Microsoft\\EventV~1\\RecentViews` file. This file can be created using https://github.com/pwntester/ysoserial.net\n\
        \    Usecase: Execute a command to bypass security restrictions that limit the use of command-line\
        \ interpreters.\n    Category: UAC Bypass\n    Privileges: Administrator\n    MitreID: T1548.002\n\
        \    OperatingSystem: Windows 7, Windows 8, Windows 8.1, Windows 10\n    Tags:\n      - Application:\
        \ GUI\n      - Execute: .NetObjects\nFull_Path:\n  - Path: C:\\Windows\\System32\\eventvwr.exe\n\
        \  - Path: C:\\Windows\\SysWOW64\\eventvwr.exe\nCode_Sample:\n  - Code: https://github.com/enigma0x3/Misc-PowerShell-Stuff/blob/master/Invoke-EventVwrBypass.ps1\n\
        Detection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/process_creation/proc_creation_win_uac_bypass_eventvwr.yml\n\
        \  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/registry/registry_set/registry_set_uac_bypass_eventvwr.yml\n\
        \  - Sigma: https://github.com/SigmaHQ/sigma/blob/197615345b927682ab7ad7fa3c5f5bb2ed911eed/rules/windows/file/file_event/file_event_win_uac_bypass_eventvwr.yml\n\
        \  - Elastic: https://github.com/elastic/detection-rules/blob/d31ea6253ea40789b1fc49ade79b7ec92154d12a/rules/windows/privilege_escalation_uac_bypass_event_viewer.toml\n\
        \  - Splunk: https://github.com/splunk/security_content/blob/86a5b644a44240f01274c8b74d19a435c7dae66e/detections/endpoint/eventvwr_uac_bypass.yml\n\
        \  - IOC: eventvwr.exe launching child process other than mmc.exe\n  - IOC: Creation or modification\
        \ of the registry value HKCU\\Software\\Classes\\mscfile\\shell\\open\\command\nResources:\n \
