      document_utf8: "---\nName: Forfiles.exe\nDescription: Selects and executes a command on a file or\
        \ set of files. This command is useful for batch processing.\nAuthor: Oddvar Moe\nCreated: 2018-05-25\n\
        Commands:\n  - Command: forfiles /p c:\\windows\\system32 /m notepad.exe /c \"{CMD}\"\n    Description:\
        \ Executes specified command since there is a match for notepad.exe in the c:\\windows\\System32\
        \ folder.\n    Usecase: Use forfiles to start a new process to evade defensive counter measures\n\
        \    Category: Execute\n    Privileges: User\n    MitreID: T1202\n    OperatingSystem: Windows\
        \ vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n      - Execute:\
        \ EXE\n  - Command: forfiles /p c:\\windows\\system32 /m notepad.exe /c \"{PATH_ABSOLUTE}:evil.exe\"\
        \n    Description: Executes the evil.exe Alternate Data Stream (AD) since there is a match for\
        \ notepad.exe in the c:\\windows\\system32 folder.\n    Usecase: Use forfiles to start a new process\
        \ from a binary hidden in an alternate data stream\n    Category: ADS\n    Privileges: User\n\
        \    MitreID: T1564.004\n    OperatingSystem: Windows vista, Windows 7, Windows 8, Windows 8.1,\
        \ Windows 10, Windows 11\n    Tags:\n      - Execute: EXE\nFull_Path:\n  - Path: C:\\Windows\\\
        System32\\forfiles.exe\n  - Path: C:\\Windows\\SysWOW64\\forfiles.exe\nDetection:\n  - Sigma:\
