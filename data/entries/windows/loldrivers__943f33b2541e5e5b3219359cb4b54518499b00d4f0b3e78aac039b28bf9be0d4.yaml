  sha256: 0489b3dec6a33e50d8a48a8dad3f5b923a81f7300e4a71358d90d2879bac9aa2
  command_metadata:
  - Command: ''
    Description: MiniTool Partition Wizard's pwdrvio.sys exposes raw physical-disk read and write operations
      through the PartitionWizardDiskAccesser device namespace. The reviewed sample accepts a numeric
      device-name suffix, resolves the corresponding physical disk, and forwards caller-controlled read/write
      requests to the disk stack. Its device is created without FILE_DEVICE_SECURE_OPEN and its create
      handler does not authorize the caller opening that namespace path. Static analysis therefore supports
      the reported standard-user access to raw disk contents once the driver is loaded, which can bypass
      file-system access controls and enable privilege escalation. This is physical-disk access, not arbitrary
      physical-memory mapping; standard-user reachability was not reproduced locally.
    Usecase: Bypass file-system access controls through raw disk read/write access.
    Privileges: Local user once the driver is loaded; administrator required to install the driver.
    OperatingSystem: Windows
  category: vulnerable driver
