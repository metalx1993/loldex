      document_utf8: "---\nName: Makecab.exe\nDescription: Binary to package existing files into a cabinet\
        \ (.cab) file\nAuthor: Oddvar Moe\nCreated: 2018-05-25\nCommands:\n  - Command: makecab {PATH_ABSOLUTE:.exe}\
        \ {PATH_ABSOLUTE}:autoruns.cab\n    Description: Compresses the target file into a CAB file stored\
        \ in the Alternate Data Stream (ADS) of the target file.\n    Usecase: Hide data compressed into\
        \ an alternate data stream\n    Category: ADS\n    Privileges: User\n    MitreID: T1564.004\n\
        \    OperatingSystem: Windows XP, Windows Vista, Windows 7, Windows 8, Windows 8.1, Windows 10,\
        \ Windows 11\n    Tags:\n      - Type: Compression\n  - Command: makecab {PATH_SMB:.exe} {PATH_ABSOLUTE}:file.cab\n\
        \    Description: Compresses the target file into a CAB file stored in the Alternate Data Stream\
        \ (ADS) of the target file.\n    Usecase: Hide data compressed into an alternate data stream\n\
        \    Category: ADS\n    Privileges: User\n    MitreID: T1564.004\n    OperatingSystem: Windows\
        \ XP, Windows Vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n  \
        \    - Type: Compression\n  - Command: makecab {PATH_SMB:.exe} {PATH_ABSOLUTE:.cab}\n    Description:\
        \ Download and compresses the target file and stores it in the target file.\n    Usecase: Download\
        \ file and compress into a cab file\n    Category: Download\n    Privileges: User\n    MitreID:\
        \ T1105\n    OperatingSystem: Windows XP, Windows Vista, Windows 7, Windows 8, Windows 8.1, Windows\
        \ 10, Windows 11\n    Tags:\n      - Type: Compression\n  - Command: makecab /F {PATH:.ddf}\n\
        \    Description: Execute makecab commands as defined in the specified Diamond Definition File\
        \ (.ddf); see resources for the format specification.\n    Usecase: Bypass command-line based\
        \ detections\n    Category: Execute\n    Privileges: User\n    MitreID: T1036\n    OperatingSystem:\
        \ Windows XP, Windows Vista, Windows 7, Windows 8, Windows 8.1, Windows 10, Windows 11\n    Tags:\n\
        \      - Type: Compression\nFull_Path:\n  - Path: C:\\Windows\\System32\\makecab.exe\n  - Path:\
        \ C:\\Windows\\SysWOW64\\makecab.exe\nDetection:\n  - Sigma: https://github.com/SigmaHQ/sigma/blob/62d4fd26b05f4d81973e7c8e80d7c1a0c6a29d0e/rules/windows/process_creation/proc_creation_win_susp_alternate_data_streams.yml\n\
        \  - Elastic: https://github.com/elastic/detection-rules/blob/12577f7380f324fcee06dab3218582f4a11833e7/rules/windows/defense_evasion_misc_lolbin_connecting_to_the_internet.toml\n\
        \  - IOC: Makecab retrieving files from Internet\n  - IOC: Makecab storing data into alternate\
